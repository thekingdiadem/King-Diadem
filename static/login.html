<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020309">
<title>KING DIADEM · ACCESS</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/logo.png" type="image/png">
<meta property="og:title" content="KING DIADEM · ACCESS">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KING DIADEM">
<meta property="og:image" content="https://king-diadem.onrender.com/static/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://king-diadem.onrender.com/static/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Mono:wght@400;500&family=Noto+Sans+Thai+Looped:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600&display=swap">
<link rel="preload" as="image" href="/static/hero_m.jpg" media="(max-width: 899px)">
<link rel="preload" as="image" href="/static/hero.jpg" media="(min-width: 900px)">
<link rel="stylesheet" href="/static/portal.css">
</head>
<body>

<div id="bg"></div>
<div id="void-overlay"></div>
<canvas id="sky" data-density="5200" aria-hidden="true"></canvas>

<main id="app">
  <div class="card">
    <div class="card-border"></div>
    <div class="card-inner">

      <!-- corner decorations -->
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <!-- logo -->
      <div class="logo-wrap">
        <img src="/static/logo.png" class="logo-img" alt="King Diadem">
        <h1 class="logo-name">KING DIADEM</h1>
        <div class="logo-sub">DriftZero · Governance OS</div>
      </div>

      <!-- divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-dot"></div>
        <div class="divider-line"></div>
      </div>

      <!-- tagline -->
      <p class="tagline">
        ระบบที่ทำให้ <strong>ทางเลือกของมนุษย์</strong> ไม่หายไป<br>
        ยืนยันตัวตนเพื่อเข้าสู่ระนาบการตัดสินใจ
      </p>

      <!-- auth buttons -->
      <a href="/login/google" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#EA4335" d="M9 3.5c1.4 0 2.6.5 3.5 1.4l2.6-2.6C13.5 0 11.4 0 9 0 5.5 0 2.5 2 1.1 5l2.8 2.2C4.6 4.7 6.6 3.5 9 3.5z"/>
          <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.9c-.2 1.1-.9 2-1.7 2.6l2.8 2.2c1.7-1.5 2.6-3.8 2.6-6.4z"/>
          <path fill="#34A853" d="M4.3 10.9c-.3-.8-.5-1.7-.5-2.6s.2-1.8.5-2.6L1.5 3.5C.5 5.1 0 7 0 9s.5 3.9 1.5 5.5l2.8-2.2z"/>
          <path fill="#FBBC05" d="M9 18c2.4 0 4.4-.8 5.9-2.2l-2.8-2.2c-.8.6-1.9 1-3.1 1-2.4 0-4.4-1.6-5.1-3.8L1.1 13C2.5 16 5.5 18 9 18z"/>
        </svg>
        ยืนยันตัวตนด้วย Google
      </a>

      <a href="#email" class="email-link" id="email-toggle">
        ◈ เข้าด้วยอีเมล &amp; รหัสผ่าน
      </a>
      <form class="email-form" id="email" autocomplete="on">
        <input id="login-email" type="email" placeholder="your@email.com" autocomplete="email" required>
        <input id="login-password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
        <div class="email-msg" id="login-msg" role="status"></div>
        <button type="submit" id="login-btn">เข้าสู่ระบบ</button>
        <a href="/static/register.html">ยังไม่มีบัญชี? สมัครด้วยอีเมล</a>
      </form>

      <!-- footer -->
      <div class="footer">
        <div class="footer-text">DRIFTZERO © 2026–3026</div>
        <div class="status-dot">ONLINE</div>
      </div>

    </div>
  </div>
</main>

<script>
/* ── Email + password login (POST /login) ── */
(function(){
  var form = document.getElementById('email'), msg = document.getElementById('login-msg');
  document.getElementById('email-toggle').addEventListener('click', function(e){
    e.preventDefault(); form.classList.add('on'); document.getElementById('login-email').focus();
  });
  if(location.hash === '#email') form.classList.add('on');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('login-btn'); btn.disabled = true; msg.className = 'email-msg'; msg.textContent = '';
    try{
      var res = await fetch('/login', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: document.getElementById('login-email').value.trim(), password: document.getElementById('login-password').value }) });
      var data = {}; try{ data = await res.json(); }catch(_){}
      if(res.ok){ msg.className = 'email-msg ok'; msg.textContent = '✓ เข้าสู่ระบบแล้ว'; location.href = '/'; return; }
      msg.textContent = '⚠ ' + (data.message || 'เข้าสู่ระบบไม่สำเร็จ');
    }catch(_){ msg.textContent = '⚠ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง'; }
    btn.disabled = false;
  });
})();

/* ── Touch: ป้องกัน double-tap zoom ── */
document.querySelector('.google-btn')?.addEventListener('touchend', function(e){
  e.preventDefault(); window.location.href=this.href;
},{passive:false});
</script>
<script src="/static/cinema_sky.js" defer></script>
</body>
</html>
