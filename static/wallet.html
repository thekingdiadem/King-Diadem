<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020308">
<title>KING DIADEM — Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap">
<style>
:root {
  --void: #020308; --deep: #04060f;
  --gold: #c8a84b; --gold-hi: #f0d070;
  --gold-lo: rgba(200,168,75,0.15); --gold-line: rgba(200,168,75,0.28);
  --blue: #4a9eff; --blue-lo: rgba(74,158,255,0.10); --blue-line: rgba(74,158,255,0.18);
  --red: #ff5577; --red-lo: rgba(255,85,119,0.10);
  --green: #4ade80;
  --tx-hi: rgba(240,248,255,0.96); --tx: rgba(195,215,245,0.80);
  --tx-lo: rgba(80,110,180,0.35);
  --r: 10px; --r-l: 14px;
  --f-mono: 'DM Mono', monospace;
  --f-body: 'Noto Sans Thai', system-ui, sans-serif;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--void); color:var(--tx); font-family:var(--f-body); font-size:15px; }
body { display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:20px; }

.card {
  width:100%; max-width:420px;
  background:rgba(6,9,20,0.92);
  border:1px solid var(--blue-line);
  border-top:2px solid var(--gold);
  border-radius:var(--r-l);
  padding:28px 24px;
  backdrop-filter:blur(20px);
  box-shadow:0 8px 48px rgba(0,0,0,0.6);
  position:relative; overflow:hidden;
}
.card::before {
  content:''; position:absolute; top:-60px; right:-60px;
  width:180px; height:180px;
  background:radial-gradient(circle, rgba(200,168,75,0.06), transparent 70%);
  pointer-events:none;
}

.header { margin-bottom:24px; }
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.title { font-family:var(--f-mono); font-size:9px; letter-spacing:3px; color:var(--gold); text-transform:uppercase; }
.back-link { font-family:var(--f-mono); font-size:9px; color:var(--tx-lo); text-decoration:none; letter-spacing:1px; transition:color .15s; }
.back-link:hover { color:var(--blue); }

.balance-wrap {
  background:rgba(2,3,8,0.70);
  border:1px solid var(--gold-line);
  border-radius:var(--r);
  padding:16px 18px;
  margin-bottom:20px;
  position:relative;
}
.balance-label { font-family:var(--f-mono); font-size:8px; letter-spacing:2px; color:var(--tx-lo); margin-bottom:6px; }
.balance-amount {
  font-family:var(--f-mono); font-size:28px; font-weight:500;
  color:var(--gold-hi);
}
.balance-amount span { font-size:13px; color:var(--gold); margin-left:4px; }
.balance-sub { font-family:var(--f-mono); font-size:8px; color:var(--tx-lo); margin-top:4px; letter-spacing:1px; }

.field-label { font-family:var(--f-mono); font-size:8px; letter-spacing:2px; color:var(--tx-lo); margin-bottom:6px; display:block; }

.input-wrap { position:relative; margin-bottom:14px; }
.input-prefix {
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  font-family:var(--f-mono); font-size:12px; color:var(--gold);
  pointer-events:none;
}
input[type="number"], input[type="email"] {
  width:100%; padding:12px 14px 12px 32px;
  background:rgba(2,3,8,0.70); color:var(--tx-hi);
  border:1px solid var(--blue-line); border-radius:var(--r);
  font-size:15px; font-family:var(--f-body); outline:none;
  -webkit-appearance:none; appearance:none;
  transition:border-color .18s, box-shadow .18s;
}
input[type="email"] { padding-left:14px; }
input:focus { border-color:rgba(200,168,75,0.40); box-shadow:0 0 0 3px rgba(200,168,75,0.06); }
input::placeholder { color:var(--tx-lo); }
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }

.quick-amounts { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.quick-btn {
  flex:1; min-width:60px; padding:7px 10px;
  background:var(--blue-lo); border:1px solid var(--blue-line);
  color:rgba(144,204,255,0.80); font-family:var(--f-mono); font-size:11px;
  border-radius:6px; cursor:pointer; text-align:center;
  transition:background .14s, border-color .14s;
}
.quick-btn:hover { background:rgba(74,158,255,0.18); border-color:rgba(74,158,255,0.35); }

.btn-topup {
  width:100%; padding:14px;
  background:var(--gold-lo); border:1px solid var(--gold-line);
  color:var(--gold-hi); font-family:var(--f-body); font-size:14px; font-weight:500;
  border-radius:var(--r-l); cursor:pointer;
  transition:background .18s, border-color .20s, box-shadow .20s;
  min-height:50px; position:relative; overflow:hidden;
}
.btn-topup:hover:not(:disabled) { background:rgba(200,168,75,0.22); border-color:rgba(200,168,75,0.50); box-shadow:0 0 20px rgba(200,168,75,0.12); }
.btn-topup:disabled { opacity:0.45; cursor:not-allowed; }

/* Status messages */
.status-box {
  display:none; padding:12px 14px; border-radius:var(--r);
  font-family:var(--f-mono); font-size:11px; letter-spacing:0.5px;
  margin-top:14px; line-height:1.6;
}
.status-box.ok    { display:block; background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.25); color:#4ade80; }
.status-box.error { display:block; background:var(--red-lo); border:1px solid rgba(255,85,119,0.28); color:rgba(255,120,150,0.92); }

/* History */
.history-label { font-family:var(--f-mono); font-size:8px; letter-spacing:2px; color:var(--tx-lo); margin:20px 0 8px; text-transform:uppercase; }
.history-list { display:flex; flex-direction:column; gap:6px; }
.history-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 12px; background:rgba(2,3,8,0.50);
  border:1px solid rgba(74,158,255,0.07); border-radius:6px;
  font-family:var(--f-mono); font-size:10px; color:var(--tx-lo);
}
.history-item .hi-amount { color:var(--green); }
.history-empty { font-family:var(--f-mono); font-size:9px; color:var(--tx-lo); letter-spacing:1px; padding:8px 0; }

.footer-lock {
  margin-top:20px; padding-top:14px; border-top:1px solid rgba(74,158,255,0.06);
  font-family:var(--f-mono); font-size:7px; color:rgba(80,110,180,0.20);
  letter-spacing:2px; text-align:center;
}
</style>
</head>
<body>
<div class="card">

  <div class="header">
    <div class="header-top">
      <div class="title">◆ WALLET</div>
      <a href="/" class="back-link">← BACK</a>
    </div>
  </div>

  <!-- Balance -->
  <div class="balance-wrap">
    <div class="balance-label">CURRENT BALANCE</div>
    <div class="balance-amount" id="balance-display">—<span>เครดิต</span></div>
    <div class="balance-sub" id="balance-sub">กำลังโหลด...</div>
  </div>

  <!-- บัญชี: มาจาก cookie ที่เซ็นแล้ว ไม่ต้องกรอกอีเมล -->
  <label class="field-label">บัญชี</label>
  <div class="balance-sub" id="wallet-account" style="font-size:11px;margin:0 0 14px;color:var(--tx)">—</div>

  <!-- Amount -->
  <label class="field-label" id="amount-label">จำนวนเงิน (บาท)</label>
  <div class="input-wrap">
    <span class="input-prefix">฿</span>
    <input type="number" id="wallet-amount" placeholder="0" min="20" max="10000" step="10" inputmode="numeric">
  </div>

  <!-- Quick amounts -->
  <div class="quick-amounts">
    <div class="quick-btn" onclick="setAmount(50)">฿50</div>
    <div class="quick-btn" onclick="setAmount(100)">฿100</div>
    <div class="quick-btn" onclick="setAmount(200)">฿200</div>
    <div class="quick-btn" onclick="setAmount(500)">฿500</div>
  </div>

  <button class="btn-topup" id="topup-btn" onclick="topup()">
    เติมเครดิต
  </button>

  <p class="balance-sub" style="font-size:11px;margin:10px 0 0">จ่ายได้ทั้งบัตรและ PromptPay (สแกน QR) — PromptPay ยอดเข้าหลังโอนสำเร็จ</p>
  <button type="button" class="btn-topup" id="portal-btn" style="margin-top:10px;background:none" onclick="portal()">จัดการสมาชิก · ยกเลิก · ใบเสร็จ</button>

  <div class="status-box" id="status-box"></div>

  <!-- History (จากระบบจริง) -->
  <div class="history-label">TRANSACTION HISTORY</div>
  <div class="history-list" id="history-list">
    <div class="history-empty">ยังไม่มีรายการ</div>
  </div>

  <div class="footer-lock">KING DIADEM™ · FATE™ A6 · HUMAN FINAL AUTHORITY</div>
</div>

<script>
(function(){
  var W = { min: 20, max: 10000, rate: 1 };
  var REASON = { run:'ใช้ตอบแชท', simulate:'จำลองอนาคต', analyze_image:'วิเคราะห์ภาพ', refund:'คืนเครดิต',
                 topup:'เติมเครดิต', stripe_plan:'แพ็กเกจ', grant:'เครดิตเริ่มต้น' };
  function $(id){ return document.getElementById(id); }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  window.setAmount = function(n){ var el = $('wallet-amount'); if(el){ el.value = n; el.focus(); preview(); } };
  function showStatus(msg, type){ var box = $('status-box'); box.textContent = msg; box.className = 'status-box ' + (type || 'ok'); }
  function clearStatus(){ var box = $('status-box'); box.className = 'status-box'; box.textContent = ''; }
  function setLoading(on, label){ var btn = $('topup-btn'); btn.disabled = on; btn.textContent = on ? (label || 'กำลังดำเนินการ...') : 'เติมเครดิต'; }
  function preview(){
    var n = Number($('wallet-amount').value) || 0;
    $('amount-label').textContent = 'จำนวนเงิน (บาท)' + (n >= W.min ? ' → ได้ ' + Math.floor(n / W.rate + 1e-9).toLocaleString() + ' เครดิต' : '');
  }

  function renderHistory(h){
    var list = $('history-list');
    if(!h || !h.length){ list.innerHTML = '<div class="history-empty">ยังไม่มีรายการ</div>'; return; }
    list.innerHTML = h.slice(0, 12).map(function(it){
      var d = Number(it.delta) || 0, when = it.created_at ? new Date(it.created_at.replace(' ', 'T') + 'Z').toLocaleString('th-TH', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
      return '<div class="history-item"><span>' + esc(when) + '</span><span>' + esc(REASON[it.reason] || it.reason || '') + '</span>' +
        '<span class="hi-amount" style="' + (d < 0 ? 'color:rgba(255,120,150,.9)' : '') + '">' + (d > 0 ? '+' : '') + d.toLocaleString() + '</span></div>';
    }).join('');
  }

  async function load(){
    try{
      var res = await fetch('/wallet/balance', { credentials: 'same-origin' });
      if(res.status === 401){
        $('wallet-account').innerHTML = 'ยังไม่ได้เข้าสู่ระบบ — <a href="/static/login.html" style="color:var(--gold-hi)">เข้าสู่ระบบ</a> เพื่อเติมเครดิต';
        $('balance-sub').textContent = 'ฟรีวันละ 20 ข้อความโดยไม่ต้องเติม';
        $('topup-btn').disabled = true; return null;
      }
      var d = await res.json();
      W.min = d.topup_min || W.min; W.max = d.topup_max || W.max; W.rate = d.thb_per_credit || W.rate;
      $('wallet-amount').min = W.min; $('wallet-amount').max = W.max;
      $('balance-display').innerHTML = Number(d.credits || 0).toLocaleString() + '<span>เครดิต</span>';
      $('wallet-account').textContent = d.email + (d.premium ? ' · PREMIUM (ไม่จำกัด)' : '');
      $('balance-sub').textContent = 'ฟรีวันนี้เหลือ ' + d.free_left + '/' + d.free_limit + ' ข้อความ · เกินจากนั้นใช้ ' + (d.run_cost || 1) + ' เครดิต/ข้อความ · 1 เครดิต = ฿' + W.rate;
      renderHistory(d.history);
      return d;
    } catch(_){ $('balance-sub').textContent = 'โหลดยอดไม่สำเร็จ — ลองรีเฟรช'; return null; }
  }

  window.topup = async function(){
    clearStatus();
    var amount = Math.floor(Number($('wallet-amount').value));
    if(!amount || amount < W.min){ showStatus('⚠ ขั้นต่ำ ฿' + W.min, 'error'); return; }
    if(amount > W.max){ showStatus('⚠ สูงสุดต่อครั้ง ฿' + W.max.toLocaleString(), 'error'); return; }
    setLoading(true);
    try{
      var res = await fetch('/wallet/topup', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ amount: amount }), credentials:'same-origin' });
      var d = {}; try{ d = await res.json(); }catch(_){}
      if(!res.ok || !d.url) throw new Error(d.error || ('เติมเครดิตไม่สำเร็จ HTTP ' + res.status));
      setLoading(true, 'กำลังไปหน้าชำระเงิน...');
      location.href = d.url;   // เครดิตเข้าเมื่อ Stripe ยืนยันการจ่ายเงิน (webhook)
    } catch(e){ showStatus('⚠ ' + e.message, 'error'); setLoading(false); }
  };

  $('wallet-amount').addEventListener('input', preview);
  $('wallet-amount').addEventListener('keydown', function(e){ if(e.key === 'Enter') window.topup(); });

  window.portal = async function(){
    try{
      var r = await fetch('/billing-portal', { method:'POST', credentials:'same-origin' }), d = await r.json();
      if(d.url){ location.href = d.url; return; }
      showStatus(d.error || 'เปิดหน้าจัดการสมาชิกไม่สำเร็จ', 'error');
    }catch(e){ showStatus('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้งนะคะ', 'error'); }
  };
  var flag = new URLSearchParams(location.search).get('topup');
  load().then(function(d){
    if(flag === 'cancel') showStatus('ยกเลิกการชำระเงินแล้ว — ยังไม่มีการตัดเงิน', 'error');
    if(flag !== 'success' || !d) return;
    // webhook อาจมาช้ากว่าการ redirect เล็กน้อย → รอดูยอดเปลี่ยน
    var start = d.credits, tries = 0;
    showStatus('ชำระเงินสำเร็จ — กำลังรอระบบยืนยันยอด...', 'ok');
    (function poll(){
      setTimeout(async function(){
        var n = await load(); tries++;
        if(n && n.credits !== start){ showStatus('✓ เติมเครดิตสำเร็จ · คงเหลือ ' + Number(n.credits).toLocaleString() + ' เครดิต', 'ok'); history.replaceState(null, '', location.pathname); }
        else if(tries < 10) poll();
        else showStatus('ชำระเงินแล้ว แต่ยอดยังไม่อัปเดต — รีเฟรชอีกครั้งใน 1–2 นาที', 'error');
      }, 2000);
    })();
  });
})();
</script>
</body>
</html>
