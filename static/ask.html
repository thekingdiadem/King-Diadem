<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010206">
<title>ASK — KING DIADEM</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=DM+Mono:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap">
<style>
:root{
  --void:#010206;--gold:#c8a440;--gold-hi:#edcc62;--gold-lo:rgba(200,164,64,0.09);
  --gold-line:rgba(200,164,64,0.20);--blue:#3a86f5;--blue-hi:#76aeff;
  --blue-lo:rgba(58,134,245,0.09);--blue-line:rgba(58,134,245,0.17);
  --tx-hi:rgba(246,250,255,0.97);--tx:rgba(198,216,248,0.82);
  --tx-mid:rgba(125,158,218,0.50);--tx-lo:rgba(60,95,170,0.26);
  --r:12px;--r-l:18px;--r-xl:28px;
  --f-display:'Cinzel',serif;--f-mono:'DM Mono',monospace;
  --f-body:'Noto Sans Thai',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--void);color:var(--tx);font-family:var(--f-body);font-size:15px;line-height:1.68;overflow-x:hidden;}

/* bg */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%,rgba(20,32,90,0.65) 0%,transparent 65%),
    radial-gradient(ellipse 40% 40% at 90% 85%,rgba(8,18,56,0.40) 0%,transparent 60%);
}

#page{
  position:relative;z-index:1;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px)+40px) 20px calc(env(safe-area-inset-bottom,0px)+48px);
  max-width:560px;margin:0 auto;gap:0;
}

/* back */
.back{
  align-self:flex-start;
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;
  color:var(--tx-lo);text-decoration:none;text-transform:uppercase;
  margin-bottom:32px;transition:color .2s;
}
.back:hover{color:var(--gold);}
.back::before{content:'←';font-size:11px;}

/* header */
.header{text-align:center;margin-bottom:40px;width:100%;}
.eyebrow{font-family:var(--f-mono);font-size:8px;letter-spacing:.28em;color:rgba(58,134,245,0.38);text-transform:uppercase;margin-bottom:12px;}
.title{
  font-family:var(--f-display);font-size:clamp(22px,7vw,38px);font-weight:600;letter-spacing:.18em;
  background:linear-gradient(135deg,#76aeff 0%,#d6eaff 32%,#edcc62 64%,#c8a440 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:8px;
}
.rule{width:160px;height:1px;margin:0 auto;background:linear-gradient(90deg,transparent,rgba(200,164,64,.30),rgba(58,134,245,.22),transparent);}

/* card */
.card{
  width:100%;margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.045);
  border-radius:var(--r-l);
  background:rgba(4,6,16,0.90);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:22px 20px;
  box-shadow:0 4px 24px rgba(0,0,0,0.55);
}

/* label */
label{
  display:block;
  font-family:var(--f-mono);font-size:8px;letter-spacing:.16em;
  color:rgba(200,164,64,0.52);text-transform:uppercase;margin-bottom:8px;
}

/* inputs */
textarea,input[type="text"],input[type="number"],select{
  width:100%;padding:12px 14px;
  border-radius:var(--r);
  border:1px solid rgba(255,255,255,0.072);
  background:rgba(2,3,8,0.72);
  color:var(--tx-hi);font-size:14.5px;font-family:var(--f-body);
  line-height:1.5;outline:none;
  transition:border-color .22s,box-shadow .22s;
  -webkit-appearance:none;
  margin-bottom:14px;
}
textarea{resize:none;min-height:90px;}
textarea:focus,input:focus,select:focus{
  border-color:rgba(200,164,64,0.44);
  box-shadow:0 0 0 3px rgba(200,164,64,0.08);
}
textarea::placeholder,input::placeholder{color:var(--tx-lo);}
select option{background:#04060f;color:var(--tx-hi);}

/* route pills */
.route-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px;}
.rpill{
  font-family:var(--f-body);font-size:13px;font-weight:500;
  padding:6px 16px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.06);
  background:rgba(6,8,22,0.68);color:var(--tx-mid);
  transition:all .20s cubic-bezier(0.4,0,0.2,1);
  min-height:34px;display:inline-flex;align-items:center;
}
.rpill:hover{border-color:rgba(200,164,64,.30);background:rgba(200,164,64,.07);color:var(--gold-hi);}
.rpill.active{border-color:rgba(200,164,64,.46);background:rgba(200,164,64,.10);color:var(--gold-hi);box-shadow:0 0 14px rgba(200,164,64,.12);}

/* btn */
.btn{
  width:100%;padding:15px;
  border-radius:var(--r-xl);
  border:1px solid rgba(200,164,64,0.30);
  background:linear-gradient(148deg,rgba(200,164,64,0.22) 0%,rgba(180,140,50,0.12) 100%);
  color:var(--gold-hi);font-family:var(--f-body);font-size:15px;font-weight:500;
  cursor:pointer;margin-top:6px;
  transition:all .22s cubic-bezier(0.4,0,0.2,1);
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 0 22px rgba(200,164,64,0.18);
  min-height:52px;
}
.btn:hover:not(:disabled){
  background:linear-gradient(148deg,rgba(200,164,64,0.36) 0%,rgba(180,140,50,0.22) 100%);
  border-color:rgba(200,164,64,0.62);
  box-shadow:0 0 40px rgba(200,164,64,0.34);transform:translateY(-2px);
}
.btn:disabled{opacity:.28;cursor:not-allowed;}
.btn-icon{font-size:16px;}

/* result */
#result-card{display:none;width:100%;margin-top:16px;}
.result-head{
  font-family:var(--f-mono);font-size:8px;letter-spacing:.20em;
  color:rgba(200,164,64,0.55);text-transform:uppercase;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.result-head::before{content:'◈';font-size:10px;color:var(--gold);}
#result-body{
  font-family:var(--f-body);font-size:14.5px;line-height:1.88;
  color:rgba(208,226,252,0.92);
  white-space:pre-wrap;word-break:break-word;
}
.result-meta{
  margin-top:14px;font-family:var(--f-mono);font-size:8px;
  color:var(--tx-lo);letter-spacing:.10em;
  display:flex;gap:14px;flex-wrap:wrap;
}
.spinner{
  width:18px;height:18px;border:2px solid rgba(200,164,64,0.20);
  border-top-color:var(--gold);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* back to main */
.nav-row{
  margin-top:28px;text-align:center;
  font-family:var(--f-mono);font-size:8px;letter-spacing:.14em;color:var(--tx-lo);
}
.nav-row a{color:var(--tx-mid);text-decoration:none;transition:color .18s;}
.nav-row a:hover{color:var(--gold-hi);}

/* anim */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);filter:blur(3px);}to{opacity:1;transform:none;filter:none;}}
.card,.btn,#result-card{animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both;}
.card:nth-child(2){animation-delay:.08s;}
.card:nth-child(3){animation-delay:.14s;}
</style>
</head>
<body>
<div id="page">

  <a href="/" class="back">กลับหน้าหลัก</a>

  <div class="header">
    <div class="eyebrow">FATE™ · Decision Engine</div>
    <div class="title">ASK LYLA</div>
    <div class="rule"></div>
  </div>

  <!-- SITUATION CARD -->
  <div class="card">
    <label>สถานการณ์ที่ต้องตัดสินใจ</label>
    <textarea id="situation" placeholder="อธิบายปัญหาหรือสถานการณ์ที่กำลังเผชิญอยู่…&#10;เช่น: กำลังเลือกระหว่างงาน 2 ที่ เงินเดือนต่างกัน แต่ความมั่นคงต่างกัน"></textarea>

    <label>เส้นทางที่เป็นไปได้</label>
    <div id="paths">
      <input type="text" placeholder="ตัวเลือก A…" value="">
      <input type="text" placeholder="ตัวเลือก B…" value="">
    </div>
    <button type="button" onclick="addPath()" style="background:transparent;border:1px solid var(--blue-line);border-radius:8px;color:var(--blue-hi);font-family:var(--f-mono);font-size:8px;padding:5px 14px;cursor:pointer;margin-bottom:14px;letter-spacing:.10em;transition:all .18s;" onmouseover="this.style.borderColor='rgba(200,164,64,.38)';this.style.color='var(--gold-hi)'" onmouseout="this.style.borderColor='var(--blue-line)';this.style.color='var(--blue-hi)'">+ เพิ่มตัวเลือก</button>

    <label>เส้นทางการวิเคราะห์</label>
    <div class="route-row">
      <span class="rpill active" data-r="general" onclick="setR(this)">ทั่วไป</span>
      <span class="rpill" data-r="risk" onclick="setR(this)">ความเสี่ยง</span>
      <span class="rpill" data-r="survival" onclick="setR(this)">รอดชีวิต</span>
      <span class="rpill" data-r="collapse" onclick="setR(this)">วิกฤต</span>
      <span class="rpill" data-r="civil" onclick="setR(this)">สังคม</span>
      <span class="rpill" data-r="vega" onclick="setR(this)">VEGA</span>
    </div>
  </div>

  <!-- SUBMIT -->
  <button class="btn" id="ask-btn" onclick="askLyla()">
    <span class="btn-icon">◈</span>
    <span id="btn-label">ถาม LYLA</span>
  </button>

  <!-- RESULT -->
  <div id="result-card" class="card">
    <div class="result-head">ผลการวิเคราะห์ FATE™</div>
    <div id="result-body"></div>
    <div class="result-meta" id="result-meta"></div>
  </div>

  <div class="nav-row">
    <a href="/">← หน้าหลัก</a>
    &nbsp;·&nbsp;
    <a href="/static/guide.html">คู่มือ</a>
  </div>

</div>

<script>
var _route = 'general';
function setR(el){
  document.querySelectorAll('.rpill').forEach(function(r){r.classList.remove('active');});
  el.classList.add('active');
  _route = el.dataset.r;
}
function addPath(){
  var wrap = document.getElementById('paths');
  var n = wrap.querySelectorAll('input').length;
  var inp = document.createElement('input');
  inp.type='text';
  inp.placeholder='ตัวเลือก '+String.fromCharCode(65+n)+'…';
  wrap.appendChild(inp);
}
async function askLyla(){
  var situation = (document.getElementById('situation').value||'').trim();
  if(!situation){ document.getElementById('situation').focus(); return; }
  var paths = Array.from(document.querySelectorAll('#paths input'))
    .map(function(i){return i.value.trim();}).filter(Boolean);

  var btn = document.getElementById('ask-btn');
  var lbl = document.getElementById('btn-label');
  btn.disabled=true;
  lbl.textContent='LYLA กำลังวิเคราะห์…';
  btn.querySelector('.btn-icon').innerHTML='<div class="spinner"></div>';

  var rc = document.getElementById('result-card');
  var rb = document.getElementById('result-body');
  var rm = document.getElementById('result-meta');
  rc.style.display='none';
  rb.textContent='';

  try{
    var res = await fetch('/run',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        input: situation + (paths.length ? '\n\nตัวเลือก:\n' + paths.map(function(p,i){return String.fromCharCode(65+i)+'. '+p;}).join('\n') : ''),
        route: _route,
        voice_mode: 'lyla',
        context: { ask_page: true, paths: paths }
      })
    });
    var data = await res.json();
    if(data.error){ rb.textContent='⚠ '+data.error; rc.style.display='block'; return; }

    var reply = (data.ai_response||data.message||'').replace(/\s*[—–-]+\s*(LYLA\s*[◈✦]?|VEGA\s*[◆◇]?|HALT\s*[⬡]?)\s*$/gi,'').trim();
    rb.textContent = reply;

    /* meta row */
    var risk = data.risk_score!=null?'RISK '+Math.round(data.risk_score):'';
    var route = (data.route||_route).toUpperCase();
    var persona = (data.persona||'LYLA').toUpperCase();
    rm.textContent = [route, persona, risk].filter(Boolean).join('  ·  ');

    rc.style.display='block';
    rc.scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){
    rb.textContent='เครือข่าย: '+e;
    rc.style.display='block';
  }finally{
    btn.disabled=false;
    lbl.textContent='ถาม LYLA อีกครั้ง';
    btn.querySelector('.btn-icon').textContent='◈';
  }
}
/* Enter ส่งได้ */
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) askLyla();
});
</script>
</body>
</html>
