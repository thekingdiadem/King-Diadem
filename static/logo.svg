<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KING DIADEM">
  <!-- มงกุฎ KING DIADEM วาดเป็นเวกเตอร์ — ขยายเท่าไหร่ก็คม (ไอคอนแอปทุกขนาดสร้างจากไฟล์นี้: scripts/build_icons.py) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#14245c"/>
      <stop offset=".55" stop-color="#0a1238"/>
      <stop offset="1" stop-color="#04050d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".45" stop-color="#ffc977"/>
      <stop offset="1" stop-color="#e48a2e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset=".5" stop-color="#a9c3f2"/>
      <stop offset="1" stop-color="#4f6fc4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4f4ff"/>
      <stop offset=".5" stop-color="#5fb4ff"/>
      <stop offset="1" stop-color="#1d4fd0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#ffb04a"/>
      <stop offset=".7" stop-color="#ffd890"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#bfe2ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#5aa8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="half">
      <!-- ปีกนอกสีเงินกวาดออกด้านข้าง + หนามชี้ขึ้น -->
      <path d="M262 378 C336 362 414 318 466 196 C468 284 424 344 344 372 C318 382 290 386 266 384 Z" fill="url(#silver)" stroke="#eef4ff" stroke-width="2"/>
      <path d="M362 334 L418 248 L392 342 Z" fill="url(#silver)" stroke="#eef4ff" stroke-width="1.5"/>
      <!-- แขนในสีทอง โอบแกนกลางแล้วบานออกที่ปลาย -->
      <path d="M258 374 C292 336 300 268 290 214 C286 188 298 164 326 146 C312 176 314 208 320 246 C330 308 302 352 266 380 Z" fill="url(#gold)" stroke="#fff3d0" stroke-width="2"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ดาวพื้นหลัง -->
  <g fill="#cfe3ff" opacity=".7">
    <circle cx="92" cy="110" r="1.6"/><circle cx="410" cy="96" r="1.3"/><circle cx="440" cy="400" r="1.5"/>
    <circle cx="70" cy="380" r="1.2"/><circle cx="150" cy="60" r="1"/><circle cx="360" cy="452" r="1.1"/>
  </g>
  <!-- ลำแสงแนวตั้ง -->
  <rect x="254" y="40" width="4" height="432" rx="2" fill="#7cc4ff" opacity=".55" filter="url(#glow)"/>
  <!-- วงแหวนสีฟ้า -->
  <circle cx="256" cy="268" r="196" fill="none" stroke="#4aa3ff" stroke-width="4" opacity=".75" filter="url(#glow)"/>
  <!-- วงแหวนสีส้ม (ครึ่งหลัง) -->
  <ellipse cx="256" cy="300" rx="234" ry="58" fill="none" stroke="url(#ring)" stroke-width="7"
           transform="rotate(-11 256 300)" filter="url(#glow)" opacity=".85"/>

  <g filter="url(#glow)">
    <use href="#half"/>
    <use href="#half" transform="translate(512 0) scale(-1 1)"/>
    <!-- แกนกลางสีฟ้า ขอบทอง -->
    <path d="M256 118 L284 252 L256 356 L228 252 Z" fill="url(#core)" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M256 160 L270 252 L256 320 L242 252 Z" fill="#eaf6ff" opacity=".55"/>
  </g>

  <!-- วงแหวนสีส้ม (ครึ่งหน้า — ผ่านหน้ามงกุฎ) -->
  <path d="M22 300 A234 58 0 0 0 490 300" fill="none" stroke="url(#ring)" stroke-width="7"
        transform="rotate(-11 256 300)" filter="url(#glow)"/>
  <!-- ประกายดาวบนยอดและที่ฐาน -->
  <circle cx="256" cy="372" r="34" fill="url(#flare)"/>
  <circle cx="256" cy="104" r="22" fill="url(#flare)"/>
  <path d="M256 84 L260 100 L276 104 L260 108 L256 124 L252 108 L236 104 L252 100 Z" fill="#fff"/>
</svg>
