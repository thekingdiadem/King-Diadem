<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020309">
<title>ออฟไลน์อยู่ · KING DIADEM</title>
<link rel="icon" href="/static/icons/icon-192.png" type="image/png">
<style>
/* เปิดได้แม้ไม่มีเน็ต — ไม่โหลดอะไรจากภายนอก (ฟอนต์ระบบ) */
:root { --void: #020309; --latte: #fff8e7; --tx: rgba(214,222,245,.84); --lo: rgba(170,182,222,.6); --gold: #ffd98f; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--void); color: var(--tx); font-family: "Noto Sans Thai Looped", system-ui, sans-serif; }
body { background: radial-gradient(60% 45% at 100% 0%, rgba(255,179,92,.09), transparent 70%), radial-gradient(55% 50% at 0% 100%, rgba(169,188,255,.09), transparent 70%), var(--void); }
main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 20px; }
img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 22px; }
h1 { font-size: clamp(24px, 6vw, 34px); color: var(--latte); font-weight: 600; }
p { margin-top: 12px; line-height: 1.85; max-width: 30em; }
.lo { color: var(--lo); font-size: 13.5px; }
button { margin-top: 26px; padding: 13px 26px; border-radius: 14px; border: 1px solid rgba(255,198,161,.4); background: rgba(255,179,92,.12);
  color: var(--gold); font: inherit; font-size: 15px; cursor: pointer; }
.ax { margin-top: 22px; font: 11px/1.6 ui-monospace, monospace; letter-spacing: .14em; color: rgba(255,217,143,.6); }
</style>
</head>
<body>
<main>
  <img src="/static/icons/icon-192.png" alt="">
  <h1>ตอนนี้ออฟไลน์อยู่</h1>
  <p>ต่ออินเทอร์เน็ตไม่ได้ชั่วคราว — แชทที่เคยคุยยังอยู่ในเครื่องของคุณ ไม่หายไปไหน</p>
  <p class="lo">ถ้ากำลังอยู่ในเหตุฉุกเฉิน โทร 1669 (เจ็บป่วยฉุกเฉิน) · 191 (ตำรวจ) · 1323 (สุขภาพจิต) ได้แม้ไม่มีเน็ต</p>
  <button type="button" onclick="location.href='/'">ลองใหม่อีกครั้ง</button>
  <p class="ax">Choice(t) ≥ 1</p>
</main>
</body>
</html>
