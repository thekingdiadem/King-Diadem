<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KING DIADEM">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/logo.png">
<link rel="icon" href="/static/logo.png" type="image/png">
<title>KING DIADEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════
   KING DIADEM — COSMIC SOVEREIGN EDITION v2
   Deep space reimagined. Warm. Alive. Human.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  /* Space palette */
  --void:       #020308;
  --deep:       #04060f;
  --mid:        #060914;
  --near:       #0a0f1e;
  --surface:    #0d1224;

  /* Crown gold */
  --gold:       #c8a84b;
  --gold-hi:    #f0d070;
  --gold-lo:    rgba(200,168,75,0.18);
  --gold-line:  rgba(200,168,75,0.30);
  --gold-glow:  rgba(200,168,75,0.12);

  /* Stellar blue */
  --blue:       #4a9eff;
  --blue-hi:    #90ccff;
  --blue-lo:    rgba(74,158,255,0.12);
  --blue-line:  rgba(74,158,255,0.20);

  /* Accent: aurora teal */
  --teal:       #38d9b8;
  --teal-lo:    rgba(56,217,184,0.10);

  /* VEGA */
  --vega:       #b48aff;
  --vega-lo:    rgba(180,138,255,0.10);

  /* Danger */
  --red:        #ff5577;
  --red-lo:     rgba(255,85,119,0.10);

  /* Text */
  --tx-hi:      rgba(240,248,255,0.96);
  --tx:         rgba(195,215,245,0.80);
  --tx-mid:     rgba(140,170,220,0.55);
  --tx-lo:      rgba(80,110,180,0.32);

  /* Glass surfaces */
  --g0:  rgba(4,6,15,0.00);
  --g1:  rgba(6,9,20,0.55);
  --g2:  rgba(6,9,20,0.78);
  --g3:  rgba(4,6,15,0.92);
  --g4:  rgba(2,3,8,0.97);

  /* Radius */
  --r-xl: 20px;
  --r-l:  14px;
  --r:    10px;
  --r-s:  7px;
  --r-xs: 4px;

  /* Layout */
  --topbar-h:   56px;
  --sidebar-w:  260px;
  --tabbar-h:   62px;

  /* Safe areas */
  --sat: env(safe-area-inset-top,0px);
  --sar: env(safe-area-inset-right,0px);
  --sab: env(safe-area-inset-bottom,0px);
  --sal: env(safe-area-inset-left,0px);

  /* Fonts */
  --f-display: 'Cinzel', serif;
  --f-mono:    'DM Mono', monospace;
  --f-body:    'Noto Sans Thai', system-ui, sans-serif;
}

/* ── RESET ─────────────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { height:100%; -webkit-text-size-adjust:100%; }
body {
  width:100%; height:100%;
  background:var(--void);
  color:var(--tx);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.68;
  overflow:hidden;
  overscroll-behavior:none;
}

/* scrollbar */
::-webkit-scrollbar { width:2px; height:2px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(74,158,255,0.18); border-radius:2px; }

/* ═══════════════════════════════════════════════════════════════
   GALAXY CANVAS
   ═══════════════════════════════════════════════════════════════ */
#galaxy-bg {
  position:fixed; inset:0; z-index:0;
  background:var(--void);
  opacity:1;
  transition:opacity 1.8s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
}
#galaxy-bg.chat-mode { opacity:0.18; }
#galaxy { display:block; position:absolute; inset:0; width:100%; height:100%; }

/* ═══════════════════════════════════════════════════════════════
   INTRO SCREEN
   ═══════════════════════════════════════════════════════════════ */
#intro-screen {
  position:fixed; inset:0; z-index:300;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  pointer-events:none;
  animation:introFade 0.7s ease 3.4s forwards;
}
@keyframes introFade { to { opacity:0; pointer-events:none; } }
#intro-canvas { position:absolute; inset:0; width:100%; height:100%; }
.intro-content {
  position:relative; z-index:2;
  display:flex; flex-direction:column;
  align-items:center; gap:0;
}
.intro-logo {
  width:72px; height:72px; object-fit:contain;
  filter: drop-shadow(0 0 24px rgba(74,158,255,0.95))
          drop-shadow(0 0 60px rgba(200,168,75,0.50))
          drop-shadow(0 0 120px rgba(74,158,255,0.28));
  animation:introRise 1.0s cubic-bezier(0.16,1,0.3,1) 0.2s both;
}
.intro-crown-ring {
  position:absolute; width:120px; height:120px;
  border-radius:50%;
  border:1px solid rgba(200,168,75,0.28);
  box-shadow: 0 0 24px rgba(200,168,75,0.12),
              inset 0 0 24px rgba(74,158,255,0.06);
  animation:introRise 1.0s ease 0.2s both, crownSpin 20s linear infinite;
  top:50%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none;
}
.intro-crown-ring::before {
  content:''; position:absolute; inset:7px; border-radius:50%;
  border:1px solid rgba(74,158,255,0.14);
}
@keyframes crownSpin { to { transform:translate(-50%,-50%) rotate(360deg); } }
.intro-title {
  font-family:var(--f-display);
  font-size:clamp(32px,9vw,62px); font-weight:600; letter-spacing:.32em;
  margin-top:22px;
  background:linear-gradient(135deg, #4a9eff 0%, #c8e4ff 28%, #fff 46%, #f0d070 62%, #c8a84b 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  animation:introRise 1.0s cubic-bezier(0.16,1,0.3,1) 0.45s both;
}
.intro-sub {
  font-family:var(--f-mono); font-size:9px; letter-spacing:.30em;
  color:rgba(74,158,255,0.36); margin-top:12px; text-transform:uppercase;
  animation:introRise 0.8s ease 0.68s both;
}
.intro-bar { width:220px; height:1px; background:rgba(74,158,255,0.07); margin:24px auto 0; overflow:hidden; animation:introRise 0.8s ease 0.9s both; }
.intro-bar-fill {
  height:100%; width:0;
  background:linear-gradient(90deg, transparent, rgba(74,158,255,0.70), rgba(200,168,75,0.90), #fff, rgba(200,168,75,0.70), transparent);
  animation:introScan 2.6s cubic-bezier(0.4,0,0.2,1) 0.9s forwards;
}
.intro-tagline {
  font-family:var(--f-mono); font-size:8px; letter-spacing:.22em;
  color:rgba(200,168,75,0.26); margin-top:18px; text-transform:uppercase;
  animation:introRise 1s ease 1.4s both;
}
@keyframes introRise {
  from { opacity:0; transform:translateY(20px); filter:blur(5px); }
  to   { opacity:1; transform:translateY(0);    filter:blur(0); }
}
@keyframes introScan {
  0%   { width:0; opacity:1; }
  75%  { width:100%; opacity:1; }
  100% { width:100%; opacity:0.25; }
}

/* ═══════════════════════════════════════════════════════════════
   HUD
   ═══════════════════════════════════════════════════════════════ */
#lyla-float {
  position:fixed; top:calc(var(--topbar-h) + var(--sat) + 16px); right:16px;
  z-index:15; font-family:var(--f-mono); font-size:7px; letter-spacing:.16em;
  color:rgba(200,168,75,0.28); pointer-events:none; transition:opacity .6s;
}
#lyla-float.hidden { opacity:0; }
#wl-float {
  position:fixed; bottom:calc(var(--tabbar-h) + var(--sab) + 18px); left:16px;
  z-index:15; display:flex; gap:6px; font-family:var(--f-mono); font-size:7px;
  pointer-events:none; transition:opacity .6s;
}
#wl-float.hidden { opacity:0; }
.wl-dot {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 9px; border-radius:999px;
  border:1px solid rgba(74,158,255,0.10);
  color:rgba(74,158,255,0.28); background:rgba(4,6,15,0.50);
  backdrop-filter:blur(10px);
}
.wl-dot::before { content:''; width:3px; height:3px; border-radius:50%; background:rgba(74,158,255,0.45); display:inline-block; box-shadow:0 0 4px rgba(74,158,255,0.55); }

/* err toast */
#err-toast {
  position:fixed; bottom:calc(var(--tabbar-h) + var(--sab) + 10px);
  left:50%; transform:translateX(-50%); z-index:999;
  font-family:var(--f-mono); font-size:12px;
  padding:12px 20px; border-radius:var(--r-l);
  background:rgba(15,5,10,0.97);
  border:1px solid rgba(255,85,119,0.38);
  color:rgba(255,120,150,0.92);
  max-width:min(92vw,440px); text-align:center; display:none;
  animation:toastUp .22s ease;
  box-shadow:0 0 32px rgba(255,85,119,0.10);
}
@keyframes toastUp {
  from { opacity:0; transform:translateX(-50%) translateY(10px); }
  to   { opacity:1; transform:translateX(-50%) translateY(0); }
}

/* ═══════════════════════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════════════════════ */
#app {
  position:relative; z-index:10;
  display:flex; flex-direction:column;
  width:100%; height:100dvh;
  background:transparent;
}
@media(min-width:900px) {
  #app { flex-direction:row; }
  #tabbar { display:none !important; }
}

/* ═══════════════════════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════════════════════ */
#sidebar {
  display:none; flex-direction:column;
  width:var(--sidebar-w); flex-shrink:0; height:100%;
  background:rgba(2,3,8,0.90);
  backdrop-filter:blur(32px) saturate(1.5);
  -webkit-backdrop-filter:blur(32px) saturate(1.5);
  border-right:1px solid rgba(200,168,75,0.08);
  padding:calc(16px + var(--sat)) 12px calc(16px + var(--sab));
  padding-left:calc(12px + var(--sal));
  overflow:hidden; gap:2px;
  box-shadow:inset -1px 0 0 rgba(200,168,75,0.04), 2px 0 24px rgba(2,3,8,0.60);
}
@media(min-width:900px) {
  #sidebar { display:flex; }
  #rail-scrim { display:none !important; }
}

.sb-brand {
  display:flex; align-items:center; gap:12px;
  padding:4px 6px 18px;
  border-bottom:1px solid rgba(200,168,75,0.08);
  margin-bottom:12px;
}
.sb-logo {
  width:32px; height:32px; object-fit:contain; opacity:.92; flex-shrink:0;
  filter:drop-shadow(0 0 10px rgba(74,158,255,0.65)) drop-shadow(0 0 22px rgba(200,168,75,0.32));
}
.sb-brand-text { font-family:var(--f-display); font-size:13px; font-weight:600; letter-spacing:.12em; background:linear-gradient(135deg,#f0d070,#c8a84b); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sb-brand-sub { font-family:var(--f-mono); font-size:7px; color:var(--tx-lo); letter-spacing:.16em; text-transform:uppercase; }

.sb-new {
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:12px; border-radius:var(--r-l);
  cursor:pointer;
  border:1px solid var(--gold-line);
  background:var(--gold-lo);
  color:var(--gold-hi); font-family:var(--f-body); font-size:14px;
  font-weight:500;
  transition:background .18s, border-color .20s, box-shadow .20s;
  min-height:46px; margin-bottom:10px; position:relative; overflow:hidden;
}
.sb-new:hover { background:rgba(200,168,75,0.16); border-color:rgba(200,168,75,0.48); box-shadow:0 0 20px rgba(200,168,75,0.12); }

.sb-label { font-family:var(--f-mono); font-size:7px; letter-spacing:.18em; color:var(--tx-lo); margin:14px 6px 5px; text-transform:uppercase; }
#session-list { flex:1; min-height:0; overflow-y:auto; margin:2px 0; padding-right:2px; overscroll-behavior:contain; }
.session-item {
  padding:9px 10px; border-radius:var(--r);
  margin-bottom:2px; cursor:pointer;
  font-size:13px; color:var(--tx);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:background .14s;
  min-height:40px; display:flex; align-items:center; justify-content:space-between; gap:6px;
}
.session-item:hover { background:var(--blue-lo); }
.session-item.on { background:rgba(74,158,255,0.09); color:var(--blue-hi); box-shadow:inset 2px 0 0 rgba(74,158,255,0.55); }
.session-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.session-del { flex-shrink:0; width:22px; height:22px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:13px; opacity:0; color:rgba(255,85,119,0.55); transition:opacity .14s; cursor:pointer; border:none; background:transparent; }
.session-item:hover .session-del, .session-item.on .session-del { opacity:1; }

.sb-btn {
  display:flex; align-items:center; gap:10px;
  width:100%; padding:10px 10px;
  border-radius:var(--r); background:transparent; border:none;
  color:var(--tx); font-family:var(--f-body); font-size:13px;
  cursor:pointer; transition:background .14s, color .14s;
  min-height:44px; text-align:left;
}
.sb-btn:hover { background:var(--blue-lo); }
.sb-btn.active { background:rgba(74,158,255,0.09); color:var(--blue-hi); box-shadow:inset 2px 0 0 rgba(74,158,255,0.50); }
.sb-btn .sym { font-size:15px; width:1.5em; opacity:.45; }
.sb-footer { margin-top:auto; padding-top:14px; border-top:1px solid rgba(74,158,255,0.06); }
.sb-google {
  display:flex; align-items:center; justify-content:center; gap:9px;
  width:100%; padding:12px; border-radius:var(--r-l);
  text-decoration:none; border:1px solid rgba(74,158,255,0.16);
  background:transparent; color:var(--tx-hi); font-size:13px;
  font-family:var(--f-body);
  transition:background .14s, border-color .18s; min-height:44px;
}
.sb-google:hover { background:var(--gold-lo); border-color:var(--gold-line); }
.sb-link { display:block; text-align:center; margin-top:8px; font-size:12px; color:var(--tx-mid); text-decoration:none; padding:6px 0; }
.sb-link:hover { color:var(--blue-hi); }
#sb-auth-user { display:none; flex-direction:column; gap:6px; }
#sb-auth-user.on { display:flex; }
#sb-auth-guest.hide { display:none; }
.btn-sb-out { width:100%; padding:11px; border-radius:var(--r-l); border:1px solid rgba(255,85,119,0.18); background:transparent; color:rgba(255,110,140,0.60); font-size:12px; cursor:pointer; transition:background .14s; min-height:44px; }
.btn-sb-out:hover { background:rgba(255,85,119,0.07); }

/* ═══════════════════════════════════════════════════════════════
   MOBILE RAIL
   ═══════════════════════════════════════════════════════════════ */
#rail-scrim { display:none; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,0.75); backdrop-filter:blur(5px); cursor:pointer; }
#rail-scrim.on { display:block; }
#rail {
  position:fixed; left:0; top:0; bottom:0; z-index:41;
  width:min(288px,86vw);
  background:rgba(2,3,8,0.99);
  backdrop-filter:blur(32px) saturate(1.5);
  -webkit-backdrop-filter:blur(32px) saturate(1.5);
  border-right:1px solid rgba(200,168,75,0.08);
  padding:calc(16px + var(--sat)) 12px calc(16px + var(--sab));
  padding-left:calc(12px + var(--sal));
  display:flex; flex-direction:column; gap:2px;
  transform:translateX(-110%);
  transition:transform .26s cubic-bezier(.4,0,.2,1);
  overflow:hidden; overscroll-behavior:contain;
  box-shadow:4px 0 48px rgba(0,0,0,0.65);
}
#rail.open { transform:translateX(0); }
@media(min-width:900px) { #rail { display:none !important; } }

/* ═══════════════════════════════════════════════════════════════
   MAIN COLUMN
   ═══════════════════════════════════════════════════════════════ */
#main-col { flex:1; min-width:0; display:flex; flex-direction:column; height:100%; background:transparent; }

/* ═══════════════════════════════════════════════════════════════
   TOPBAR
   ═══════════════════════════════════════════════════════════════ */
#topbar {
  flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:calc(10px + var(--sat)) 16px 10px;
  padding-right:calc(16px + var(--sar));
  min-height:calc(var(--topbar-h) + var(--sat));
  background:transparent;
  border-bottom:1px solid transparent;
  position:relative; z-index:30;
  transition:background .8s ease, border-color .8s ease, backdrop-filter .8s ease;
}
#topbar.chat-mode {
  background:rgba(2,3,8,0.82);
  border-bottom-color:rgba(200,168,75,0.10);
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
}
#topbar.chat-mode::after {
  content:''; position:absolute; bottom:-1px; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent 0%, rgba(200,168,75,0.28) 30%, rgba(74,158,255,0.25) 70%, transparent 100%);
  pointer-events:none;
}

.topbar-left { display:flex; align-items:center; gap:11px; min-width:0; flex:1; }
.topbar-logo {
  width:28px; height:28px; object-fit:contain; opacity:.92; flex-shrink:0;
  filter:drop-shadow(0 0 7px rgba(74,158,255,0.60)) drop-shadow(0 0 16px rgba(200,168,75,0.30));
}
.logo-text { font-family:var(--f-display); font-size:14px; font-weight:600; letter-spacing:.13em; background:linear-gradient(135deg,var(--blue-hi) 0%,#d8eaff 40%,var(--gold-hi) 70%,var(--gold) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.logo-sub { font-family:var(--f-mono); font-size:6.5px; letter-spacing:.15em; color:var(--tx-lo); text-transform:uppercase; }

.topbar-right { display:flex; gap:5px; align-items:center; justify-content:flex-end; flex-shrink:0; }

.icon-btn {
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid rgba(74,158,255,0.14);
  background:rgba(6,9,20,0.60);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  color:var(--tx-hi); border-radius:var(--r);
  width:40px; height:40px; cursor:pointer; font-size:18px;
  transition:background .14s, border-color .18s; flex-shrink:0;
}
.icon-btn:hover { background:var(--gold-lo); border-color:var(--gold-line); }
@media(min-width:900px) { .icon-btn { display:none; } }

.sys-badge {
  font-family:var(--f-mono); font-size:8px;
  padding:3px 8px; border-radius:4px; border:1px solid; letter-spacing:.05em; white-space:nowrap;
}
.sys-badge.ok { border-color:rgba(74,158,255,0.35); color:rgba(120,195,255,0.88); background:rgba(74,158,255,0.07); box-shadow:0 0 6px rgba(74,158,255,0.10); }
.sys-badge.off { border-color:rgba(255,255,255,0.05); color:var(--tx-lo); background:transparent; }

@media(max-width:420px) { #b-eng,#b-lyla,#b-stripe { display:none; } .logo-sub { display:none; } }
@media(max-width:520px) { #b-stripe { display:none; } }

#sys-time { font-family:var(--f-mono); font-size:11px; color:rgba(200,168,75,0.45); white-space:nowrap; }
#credits-pill { font-size:9px; color:rgba(74,158,255,0.38); font-family:var(--f-mono); }

.tone-pill {
  font-family:var(--f-mono); font-size:8px;
  padding:3px 10px; border-radius:999px;
  border:1px solid var(--blue-line);
  color:rgba(144,204,255,0.78); letter-spacing:.08em; white-space:nowrap;
  transition:all .4s ease;
}
.tone-pill.lyla { border-color:rgba(74,158,255,0.32); color:rgba(144,204,255,0.80); }
.tone-pill.vega { border-color:rgba(180,138,255,0.38); color:rgba(196,168,255,0.86); }
.tone-pill.crisis { border-color:rgba(255,85,119,0.42); color:rgba(255,120,150,0.90); }

/* ═══════════════════════════════════════════════════════════════
   VIEWS
   ═══════════════════════════════════════════════════════════════ */
#view-wrap { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; background:transparent; position:relative; }
.view { display:none; flex:1; min-height:0; flex-direction:column; }
.view.active { display:flex; }

/* ═══════════════════════════════════════════════════════════════
   CHAT VIEW
   ═══════════════════════════════════════════════════════════════ */
#chat-scroll {
  flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:40px 16px 24px;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  background:transparent;
  opacity:0; pointer-events:none;
  transition:opacity 0.7s ease;
}
#chat-scroll.visible { opacity:1; pointer-events:auto; }
@media(min-width:600px) { #chat-scroll { padding:48px 40px 30px; } }
@media(min-width:900px) { #chat-scroll { padding:48px 56px 30px; } }

/* Messages */
.msg {
  display:flex; gap:12px; align-items:flex-start;
  margin-bottom:24px;
  animation:msgIn .30s cubic-bezier(0.16,1,0.3,1);
  max-width:min(100%,800px); margin-left:auto; margin-right:auto; width:100%;
}
@keyframes msgIn {
  from { opacity:0; transform:translateY(10px) scale(0.98); filter:blur(2px); }
  to   { opacity:1; transform:translateY(0) scale(1);       filter:blur(0); }
}
.msg.user { flex-direction:row-reverse; }
.msg-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; margin-top:2px; }
.msg.user .msg-avatar { display:none; }
.msg.system .msg-avatar {
  background:rgba(74,158,255,0.06); border:1px solid rgba(74,158,255,0.14);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 14px rgba(74,158,255,0.10);
}
.msg-logo { width:100%; height:100%; object-fit:contain; padding:5px; opacity:.82; }
.msg-body { flex:1; min-width:0; }
.msg.user .msg-body { display:flex; justify-content:flex-end; }

/* User bubble */
.msg.user .msg-text {
  font-size:15px; line-height:1.74;
  color:rgba(210,230,255,0.94);
  background:linear-gradient(135deg, rgba(74,158,255,0.14) 0%, rgba(74,158,255,0.08) 100%);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:22px 22px 5px 22px;
  padding:13px 17px;
  max-width:min(88%,500px);
  white-space:pre-wrap; word-break:break-word;
  border:1px solid rgba(74,158,255,0.20);
  box-shadow:0 4px 24px rgba(74,158,255,0.07), inset 0 1px 0 rgba(255,255,255,0.05);
}

/* System bubble */
.msg.system .msg-text {
  font-size:15px; line-height:1.84;
  color:rgba(220,232,252,0.92);
  background:rgba(6,9,20,0.72);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:5px 22px 22px 22px;
  padding:15px 18px;
  white-space:pre-wrap; word-break:break-word;
  border:1px solid rgba(74,158,255,0.10);
  box-shadow:0 4px 28px rgba(2,3,8,0.44), inset 0 1px 0 rgba(74,158,255,0.05);
}

.msg-persona {
  font-family:var(--f-mono); font-size:9px;
  margin-top:10px; letter-spacing:.12em; display:block;
}
.msg-persona.lyla { color:rgba(144,204,255,0.58); }
.msg-persona.vega { color:rgba(196,168,255,0.65); }
.msg-persona.crisis { color:rgba(255,120,150,0.68); }

.route-tag {
  font-family:var(--f-mono); font-size:8px;
  margin-top:8px; color:var(--tx-lo);
  display:inline-flex; align-items:center; gap:5px; letter-spacing:.07em;
}
.route-tag::before { content:''; display:inline-block; width:3px; height:3px; border-radius:50%; background:rgba(200,168,75,0.45); opacity:.50; }

/* Thinking */
.thinking { display:flex; gap:6px; padding:7px 2px 5px; align-items:center; }
.thinking span { width:7px; height:7px; border-radius:50%; background:rgba(74,158,255,0.65); animation:thinkPulse 1.1s ease-in-out infinite; box-shadow:0 0 7px rgba(74,158,255,0.38); }
.thinking span:nth-child(2) { animation-delay:.20s; background:rgba(200,168,75,0.65); box-shadow:0 0 7px rgba(200,168,75,0.38); }
.thinking span:nth-child(3) { animation-delay:.40s; }
@keyframes thinkPulse { 0%,100% { opacity:.16; transform:scale(.70); } 50% { opacity:.90; transform:scale(1.08); } }

/* ═══════════════════════════════════════════════════════════════
   TOOLS & GOV PADS
   ═══════════════════════════════════════════════════════════════ */
.tools-pad, .gov-pad {
  padding:16px 14px calc(16px + var(--sab));
  overflow-y:auto; flex:1; min-height:0;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  max-width:720px; margin:0 auto; width:100%;
}
@media(min-width:600px) { .tools-pad, .gov-pad { padding:22px 22px calc(22px + var(--sab)); } }

/* Section cards */
.section {
  margin-bottom:12px;
  border:1px solid rgba(74,158,255,0.09);
  border-radius:var(--r-l);
  background:rgba(6,9,20,0.70);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  overflow:hidden;
  transition:border-color .25s, box-shadow .25s;
  box-shadow:0 4px 28px rgba(2,3,8,0.44);
}
.section:hover { border-color:rgba(74,158,255,0.18); box-shadow:0 4px 36px rgba(2,3,8,0.55); }

.sec-head {
  padding:10px 16px;
  border-bottom:1px solid rgba(74,158,255,0.07);
  font-family:var(--f-mono); font-size:8.5px;
  letter-spacing:.14em; color:rgba(200,168,75,0.52);
  text-transform:uppercase;
  display:flex; align-items:center; gap:10px;
  background:linear-gradient(90deg, rgba(200,168,75,0.035), transparent);
}
.sec-head::before { content:''; width:2px; height:12px; border-radius:2px; flex-shrink:0; background:linear-gradient(to bottom, var(--gold), rgba(74,158,255,0.40)); box-shadow:0 0 7px rgba(200,168,75,0.28); }
.sec-body { padding:16px; }

/* Inputs */
.section textarea,
.section input[type="text"],
.section input[type="email"],
.section input[type="tel"],
.section input[type="file"],
.stripe-input,
.sim-path input {
  width:100%; padding:12px 14px; margin-bottom:10px;
  border-radius:var(--r); border:1px solid rgba(74,158,255,0.13);
  background:rgba(2,3,8,0.68); color:var(--tx-hi);
  font-size:15px; font-family:var(--f-body);
  line-height:1.5; outline:none; min-height:48px;
  transition:border-color .20s, box-shadow .20s;
  -webkit-appearance:none;
}
.section textarea:focus,
.section input:focus,
.stripe-input:focus,
.sim-path input:focus { border-color:rgba(200,168,75,0.38); box-shadow:0 0 0 3px rgba(200,168,75,0.06), 0 0 18px rgba(200,168,75,0.04); }
.section textarea::placeholder, .section input::placeholder { color:var(--tx-lo); }

.sim-path { display:flex; gap:8px; align-items:center; margin-bottom:9px; }
.sim-path input { margin-bottom:0; flex:1; }
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
.photo-out { min-height:72px; padding:14px; border-radius:var(--r); border:1px solid rgba(74,158,255,0.09); background:rgba(2,3,8,0.62); font-size:12px; font-family:var(--f-mono); white-space:pre-wrap; word-break:break-word; line-height:1.68; margin-top:10px; color:var(--tx); }
.plan-row label { display:flex; align-items:center; gap:9px; font-size:14px; margin:10px 0; color:var(--tx); min-height:40px; cursor:pointer; }

/* Buttons */
.btn {
  width:100%; padding:14px;
  border-radius:var(--r-l); border:1px solid;
  font-family:var(--f-body); font-size:14px; font-weight:500;
  cursor:pointer; margin-top:10px;
  transition:background .18s, border-color .20s, box-shadow .20s;
  min-height:50px;
}
.btn-primary { background:rgba(74,158,255,0.08); border-color:rgba(74,158,255,0.20); color:var(--blue-hi); }
.btn-primary:hover { background:rgba(74,158,255,0.16); border-color:rgba(74,158,255,0.42); box-shadow:0 0 22px rgba(74,158,255,0.11); }
.btn-gold { background:rgba(200,168,75,0.09); border-color:var(--gold-line); color:var(--gold-hi); }
.btn-gold:hover { background:rgba(200,168,75,0.18); border-color:rgba(200,168,75,0.48); box-shadow:0 0 22px rgba(200,168,75,0.12); }
.btn:disabled { opacity:.25; cursor:not-allowed; }

/* Waterline meters */
.wl-label { font-size:8.5px; font-family:var(--f-mono); color:var(--tx-lo); letter-spacing:.10em; margin:10px 0 5px; }
.wl-meter { height:3px; background:rgba(255,255,255,0.035); border-radius:3px; overflow:hidden; }
.wl-fill { height:100%; transition:width .75s cubic-bezier(0.4,0,0.2,1); border-radius:3px; }
.wl-fill.safe { background:linear-gradient(90deg,rgba(74,158,255,0.50),rgba(144,204,255,0.88)); box-shadow:0 0 6px rgba(74,158,255,0.28); }
.wl-fill.warn { background:linear-gradient(90deg,rgba(200,140,20,0.58),#f0a820); box-shadow:0 0 6px rgba(200,140,20,0.28); }
.wl-fill.crit { background:linear-gradient(90deg,rgba(255,85,119,0.58),#ff5577); box-shadow:0 0 8px rgba(255,85,119,0.38); }

/* LYLA status */
.lyla-item { display:flex; justify-content:space-between; font-size:13px; margin:10px 0; align-items:center; }
.lyla-key { font-family:var(--f-mono); color:var(--tx-lo); font-size:8px; text-transform:uppercase; letter-spacing:.12em; }
.lyla-val { font-family:var(--f-mono); font-size:12px; font-weight:500; }
.lyla-val.safe, .lyla-val.nominal { color:rgba(144,204,255,0.90); }
.lyla-val.warn { color:#f0a820; }
.lyla-val.crit { color:#ff5577; }
.kd-diag { font-family:var(--f-mono); font-size:11.5px; line-height:1.72; color:var(--tx); white-space:pre-wrap; word-break:break-word; min-height:2em; }

/* Route grid */
.route-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
@media(min-width:400px) { .route-grid { grid-template-columns:repeat(3,1fr); } }
.route-chip {
  font-family:var(--f-body); font-size:13px; font-weight:500;
  padding:13px 6px; border-radius:var(--r-l);
  border:1px solid rgba(74,158,255,0.10);
  background:rgba(4,6,15,0.55);
  color:var(--tx-mid); cursor:pointer; text-align:center;
  transition:background .18s, border-color .20s, color .18s, box-shadow .20s;
  min-height:50px; display:flex; align-items:center; justify-content:center;
}
.route-chip:hover { background:var(--gold-lo); border-color:var(--gold-line); color:var(--gold-hi); box-shadow:0 0 14px rgba(200,168,75,0.09); }
.route-chip.active { border-color:rgba(200,168,75,0.42); color:var(--gold-hi); background:rgba(200,168,75,0.10); box-shadow:0 0 18px rgba(200,168,75,0.12), inset 0 0 0 1px rgba(200,168,75,0.08); }

/* ═══════════════════════════════════════════════════════════════
   INPUT DOCK
   ═══════════════════════════════════════════════════════════════ */
#input-dock {
  flex-shrink:0;
  border-top:1px solid transparent;
  background:transparent;
  padding:10px 14px calc(10px + var(--sab));
  padding-right:calc(14px + var(--sar));
  position:relative; z-index:20;
  transition:background .8s ease, border-color .8s ease;
}
#input-dock.chat-mode {
  background:rgba(2,3,8,0.86);
  border-top-color:rgba(200,168,75,0.08);
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
}
#input-dock.chat-mode::before {
  content:''; position:absolute; top:-1px; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent 0%, rgba(74,158,255,0.22) 30%, rgba(200,168,75,0.26) 70%, transparent 100%);
  pointer-events:none;
}

/* Context tags */
.ctx-scroll { display:flex; gap:7px; overflow-x:auto; padding-bottom:10px; margin-bottom:8px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.ctx-scroll::-webkit-scrollbar { display:none; }
.ctx-tag {
  flex-shrink:0; font-family:var(--f-body); font-size:13px; font-weight:500;
  padding:6px 16px; border-radius:999px; cursor:pointer; white-space:nowrap;
  border:1px solid rgba(74,158,255,0.13);
  background:rgba(4,6,15,0.55);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  color:var(--tx-mid);
  transition:all .18s ease; min-height:34px; display:inline-flex; align-items:center;
}
.ctx-tag:hover { color:var(--gold-hi); border-color:var(--gold-line); background:var(--gold-lo); }
.ctx-tag.active { border-color:rgba(200,168,75,0.40); color:var(--gold-hi); background:rgba(200,168,75,0.10); box-shadow:0 0 14px rgba(200,168,75,0.10); }

/* Input row */
.input-row { display:flex; gap:9px; align-items:flex-end; max-width:880px; margin:0 auto; }
#main-input {
  flex:1; min-height:50px; max-height:130px;
  padding:13px 18px;
  border-radius:var(--r-xl);
  border:1px solid rgba(74,158,255,0.16);
  background:rgba(6,9,20,0.76);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  color:var(--tx-hi); font-size:16px; font-family:var(--f-body);
  line-height:1.5; resize:none; outline:none;
  transition:border-color .22s, box-shadow .22s;
  -webkit-appearance:none;
  box-shadow:0 2px 16px rgba(2,3,8,0.44);
}
#main-input:focus { border-color:rgba(200,168,75,0.36); box-shadow:0 0 0 3px rgba(200,168,75,0.06), 0 0 22px rgba(200,168,75,0.05); }
#main-input::placeholder { color:rgba(80,110,180,0.35); }

#run-btn {
  flex-shrink:0; min-width:52px; min-height:50px;
  padding:0 16px; border-radius:var(--r-xl); cursor:pointer;
  border:1px solid var(--gold-line);
  background:rgba(200,168,75,0.14);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  color:var(--gold-hi);
  font-family:var(--f-mono); font-size:18px;
  transition:background .18s, border-color .20s, box-shadow .20s, transform .12s;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 14px rgba(200,168,75,0.09);
}
#run-btn:hover:not(:disabled) { background:rgba(200,168,75,0.24); border-color:rgba(200,168,75,0.55); box-shadow:0 0 28px rgba(200,168,75,0.18); transform:scale(1.04); }
#run-btn:active:not(:disabled) { transform:scale(0.97); }
#run-btn:disabled { opacity:.24; cursor:not-allowed; }
#run-btn-label { display:none; }
@media(min-width:480px) { #run-btn { font-size:13px; min-width:70px; } #run-btn-label { display:inline; } }

/* ═══════════════════════════════════════════════════════════════
   TABBAR — Mobile
   ═══════════════════════════════════════════════════════════════ */
#tabbar {
  flex-shrink:0; display:flex;
  border-top:1px solid rgba(200,168,75,0.07);
  background:rgba(2,3,8,0.94);
  backdrop-filter:blur(28px) saturate(1.3);
  -webkit-backdrop-filter:blur(28px) saturate(1.3);
  padding-bottom:var(--sab); position:relative; z-index:20;
  box-shadow:0 -4px 28px rgba(2,3,8,0.55);
}
.tab-btn {
  flex:1; padding:9px 4px 5px;
  border:none; background:transparent;
  color:rgba(74,110,180,0.38);
  font-family:var(--f-body); font-size:11px; font-weight:500;
  cursor:pointer; transition:color .18s;
  min-height:54px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px;
  position:relative;
}
.tab-btn::before {
  content:''; position:absolute; top:0; left:20%; right:20%; height:2px;
  border-radius:0 0 3px 3px;
  background:transparent; transition:background .22s, box-shadow .22s;
}
.tab-btn:hover { color:var(--tx); }
.tab-btn.active { color:var(--gold-hi); }
.tab-btn.active::before { background:linear-gradient(90deg,rgba(200,168,75,0.68),rgba(74,158,255,0.55)); box-shadow:0 0 10px rgba(200,168,75,0.28); }
.tab-btn .ti { font-size:20px; }

#bottom-note { flex-shrink:0; text-align:center; font-family:var(--f-mono); font-size:7px; color:var(--tx-lo); padding:4px 8px 7px; letter-spacing:.10em; display:none; }
@media(min-width:900px) { #bottom-note { display:block; } }

/* UPGRADE MODAL */
#upgrade-modal { display:none; position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.82); backdrop-filter:blur(10px); align-items:center; justify-content:center; }

/* Reduced motion */
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
@media(max-height:500px) and (orientation:landscape) { #topbar { padding-top:5px; padding-bottom:5px; min-height:40px; } #input-dock { padding-top:5px; padding-bottom:calc(5px + var(--sab)); } #tabbar { display:none; } .icon-btn { display:inline-flex !important; } }

/* ═══════════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════════════
   KING DIADEM — OBSIDIAN SOVEREIGN v3 (LYLA Kernel Edition)
   One design language. Zero compromise.
   Depth through restraint. Power through precision.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  --void:    #010206;
  --deep:    #040710;
  --mid:     #070918;
  --near:    #0b0f26;
  --surface: #101630;
  --gold:      #c8a440;
  --gold-hi:   #edcc62;
  --gold-lo:   rgba(200,164,64,0.09);
  --gold-line: rgba(200,164,64,0.20);
  --gold-glow: rgba(200,164,64,0.13);
  --blue:      #3a86f5;
  --blue-hi:   #76aeff;
  --blue-lo:   rgba(58,134,245,0.09);
  --blue-line: rgba(58,134,245,0.17);
  --teal:  #2bcfb4;
  --vega:  #a67df5;
  --red:   #f03558;
  --tx-hi:  rgba(246,250,255,0.97);
  --tx:     rgba(198,216,248,0.82);
  --tx-mid: rgba(125,158,218,0.50);
  --tx-lo:  rgba(60,95,170,0.26);
  --g1: rgba(6,8,22,0.62);
  --g2: rgba(4,5,14,0.84);
  --g3: rgba(2,3,8,0.97);
  --s1: 0 1px 4px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.022);
  --s2: 0 4px 20px rgba(0,0,0,0.58), 0 0 0 1px rgba(255,255,255,0.028);
  --s3: 0 14px 48px rgba(0,0,0,0.68), 0 0 0 1px rgba(255,255,255,0.032);
  --sg: 0 0 22px rgba(200,164,64,0.20), 0 0 64px rgba(200,164,64,0.07);
  --sb: 0 0 18px rgba(58,134,245,0.17), 0 0 52px rgba(58,134,245,0.05);
  --r-xl: 28px;
  --r-l:  18px;
  --r:    12px;
  --r-s:  8px;
  --r-xs: 4px;
  --topbar-h:  58px;
  --sidebar-w: 264px;
  --tabbar-h:  64px;
}

#galaxy-bg {
  background:
    radial-gradient(ellipse 72% 55% at 48% 0%, rgba(16,26,72,0.70) 0%, transparent 68%),
    radial-gradient(ellipse 38% 38% at 92% 88%, rgba(8,18,56,0.44) 0%, transparent 62%),
    radial-gradient(ellipse 25% 30% at 8% 75%, rgba(12,8,40,0.32) 0%, transparent 55%),
    #010206;
}

.intro-title { font-size:clamp(27px,7vw,54px); letter-spacing:.38em; text-shadow:0 0 90px rgba(200,164,64,0.38),0 0 200px rgba(58,134,245,0.18); }
.intro-sub { color:rgba(58,134,245,0.40); letter-spacing:.32em; }
.intro-tagline { color:rgba(200,164,64,0.26); letter-spacing:.25em; }

#topbar { border-bottom:1px solid transparent; position:relative; transition:background .7s ease,border-color .7s ease,backdrop-filter .7s ease,box-shadow .7s ease; }
#topbar.chat-mode { background:rgba(1,2,6,0.92); border-bottom-color:rgba(255,255,255,0.035); backdrop-filter:blur(36px) saturate(1.7) brightness(1.04); -webkit-backdrop-filter:blur(36px) saturate(1.7) brightness(1.04); box-shadow:0 1px 0 rgba(200,164,64,0.07),0 10px 40px rgba(0,0,0,0.40); }
#topbar.chat-mode::after { background:linear-gradient(90deg,transparent 0%,rgba(58,134,245,0.32) 22%,rgba(200,164,64,0.52) 50%,rgba(58,134,245,0.32) 78%,transparent 100%); opacity:0.9; }
.logo-text { background:linear-gradient(138deg,#76aeff 0%,#d6eaff 32%,#edcc62 64%,#c8a440 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:.15em; font-size:14.5px; }
.sys-badge.ok { border-color:rgba(58,134,245,0.42); color:rgba(118,174,255,0.92); background:rgba(58,134,245,0.08); box-shadow:0 0 8px rgba(58,134,245,0.14); font-size:7.5px; letter-spacing:.09em; }
.icon-btn { border:1px solid rgba(255,255,255,0.065); background:rgba(6,8,22,0.74); border-radius:var(--r); transition:background .16s,border-color .18s,box-shadow .16s; }
.icon-btn:hover { background:rgba(200,164,64,0.08); border-color:rgba(200,164,64,0.28); box-shadow:0 0 12px rgba(200,164,64,0.08); }
.tone-pill { font-size:7.5px; padding:3px 12px; letter-spacing:.11em; }
.tone-pill.lyla  { border-color:rgba(58,134,245,0.30); color:rgba(118,174,255,0.84); }

.lineage-btn {

  letter-spacing:.14em; text-transform:uppercase;

  border-radius:999px;
  padding:4px 12px;
  cursor:pointer;

.lin-key { font-size:7px; letter-spacing:.18em; color:rgba(200,164,64,0.48); text-transform:uppercase; white-space:nowrap; }

<script>
(function(){
  var el=document.getElementById('intro-screen');
  if(!el) return;
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },4000);
})();
(function(){
  var cv=document.getElementById('intro-canvas'); if(!cv) return;
  var ctx=cv.getContext('2d'); var W,H,t=0;
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; } resize();
  var dust=[];
  for(var i=0;i<240;i++) dust.push({x:Math.random(),y:Math.random(),r:.15+Math.random()*.55,a:.03+Math.random()*.12,ph:Math.random()*Math.PI*2,sp:.3+Math.random()*.8});
  function frame(){
    if(t>4100){ return; } t+=16;
    ctx.clearRect(0,0,W,H);
    var bg=ctx.createRadialGradient(W*.5,H*.46,0,W*.5,H*.5,Math.max(W,H)*.90);
    bg.addColorStop(0,'#070a1e'); bg.addColorStop(.4,'#05071a'); bg.addColorStop(1,'#03040d');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    var prog=Math.min(1,t/2000);
    ctx.globalCompositeOperation='screen';
    var nb1=ctx.createRadialGradient(W*.28,H*.40,0,W*.28,H*.40,W*.52);
    nb1.addColorStop(0,'rgba(74,158,255,'+(0.14*prog)+')'); nb1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=nb1; ctx.fillRect(0,0,W,H);
    var nb2=ctx.createRadialGradient(W*.76,H*.58,0,W*.76,H*.58,W*.50);
    nb2.addColorStop(0,'rgba(200,168,75,'+(0.12*prog)+')'); nb2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=nb2; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
    for(var i=0;i<dust.length;i++){
      var d=dust[i],tw=d.a*(0.5+0.5*Math.sin(t*d.sp*.001+d.ph));
      ctx.beginPath(); ctx.arc(d.x*W,d.y*H,d.r,0,Math.PI*2);
      ctx.fillStyle=(d.x<0.55?'rgba(120,195,255,':'rgba(220,185,100,')+tw+')'; ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

async function readJson(res){
  var ct=(res.headers.get('content-type')||'').toLowerCase();
  var txt=await res.text();
  if(!res.ok){
    if(res.status===502||res.status===503||res.status===504){
      throw new Error('ระบบกำลังตื่นนอน — รอ 30 วินาทีแล้วลองใหม่ (Render cold start)');
    }
    throw new Error('HTTP '+res.status+' — '+txt.slice(0,80));
  }
  var tr=txt.trim();
  if(tr.startsWith('<')||(!ct.includes('json')&&tr.charAt(0)!=='{'&&tr.charAt(0)!=='['))
    throw new Error('Server ตอบไม่ใช่ JSON — อาจยังไม่ตื่น ลองใหม่สักครู่');
  try{return JSON.parse(txt);}catch(e){throw new Error('Not JSON');}
}
async function fetchRetry(url,opts,retries,delayMs){
  retries=retries||3; delayMs=delayMs||1200;
  for(var i=0;i<retries;i++){
    try{
      var r=await fetch(url,opts);
      if(r.status===503&&i<retries-1){ var tx=await r.text(); if(tx.toLowerCase().includes('unavailable')||tx.toLowerCase().includes('demand')){ showErr('AI ยุ่งอยู่ กำลังลองใหม่… ('+(i+1)+'/'+retries+')',3000); await new Promise(function(res){setTimeout(res,delayMs*Math.pow(2,i));}); continue; } return new Response(tx,{status:503,headers:{'content-type':'application/json'}}); }
      return r;
    }catch(e){ if(i===retries-1)throw e; await new Promise(function(res){setTimeout(res,delayMs*Math.pow(2,i));}); }
  }
}

  var photoBtns=document.querySelectorAll('#section-photo .btn');
  photoBtns.forEach(function(b){b.disabled=true;});
  var fd=new FormData();fd.append('file',fi.files[0]);out.textContent='กำลังวิเคราะห์ภาพ…';
  try{
    var res=await fetchRetry('/analyze-image',{method:'POST',body:fd},2,1200);
    var data=await readJson(res);
    if(data.error){out.textContent='⚠ '+data.error;return;}
    var txt=(data.analysis||'').trim();
    if(!txt)txt='LYLA วิเคราะห์ภาพไม่ได้ — กรุณาลองภาพอื่น';
    out.textContent=txt+'\n\n['+(data.filename||'')+']';
  }catch(e){out.textContent='ERROR: '+e;}
  finally{photoBtns.forEach(function(b){b.disabled=false;});}
}
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/static/service-worker.js',{scope:'/'})
      .then(function(reg){
        reg.addEventListener('updatefound',function(){
          var nw=reg.installing;
          nw.addEventListener('statechange',function(){
            if(nw.state==='installed'&&navigator.serviceWorker.controller) nw.postMessage({type:'SKIP_WAITING'});
          });
        });
      }).catch(function(err){console.warn('[KD SW]',err);});
    var refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!refreshing){refreshing=true;window.location.reload();}
    });
  });
}
(function(){
  function haptic(type){if(!navigator.vibrate)return;if(type==='light')navigator.vibrate(6);}
  var origRun=window.run;window.run=function(){haptic('light');return origRun&&origRun();};
  var TABS=['chat','tools','gov'],_tx=0,_ty=0,_sw=false;
  var vw=document.getElementById('view-wrap');
  if(vw){
    vw.addEventListener('touchstart',function(e){if(e.target.closest('#chat-scroll,#session-list,.tools-pad,.gov-pad,.ctx-scroll'))return;_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;_sw=true;},{passive:true});
    vw.addEventListener('touchend',function(e){if(!_sw)return;_sw=false;var dx=e.changedTouches[0].clientX-_tx,dy=e.changedTouches[0].clientY-_ty;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.8)return;var cur=TABS.indexOf(window._activeTab||'chat'),next=dx<0?Math.min(cur+1,TABS.length-1):Math.max(cur-1,0);if(next!==cur){haptic('light');setTab(TABS[next]);}},{passive:true});
  }
  var _edgeTx=0,_edgeSw=false;
  document.addEventListener('touchstart',function(e){if(e.touches[0].clientX<22){_edgeTx=e.touches[0].clientX;_edgeSw=true;}},{passive:true});
  document.addEventListener('touchend',function(e){if(!_edgeSw)return;_edgeSw=false;var dx=e.changedTouches[0].clientX-_edgeTx;if(dx>40){haptic('light');openRailMobile();}},{passive:true});
  if(window.visualViewport){
    var _app=document.getElementById('main-col'),_kbOpen=false;
    function onVP(){if(!_app)return;var vvp=window.visualViewport,kbH=Math.max(0,window.innerHeight-vvp.height-vvp.offsetTop);if(kbH>120){if(!_kbOpen){_kbOpen=true;_app.style.paddingBottom=kbH+'px';setTimeout(function(){var cs=document.getElementById('chat-scroll');if(cs)cs.scrollTop=cs.scrollHeight;},200);}}else{if(_kbOpen){_kbOpen=false;_app.style.paddingBottom='';}}}
    window.visualViewport.addEventListener('resize',onVP,{passive:true});
    window.visualViewport.addEventListener('scroll',onVP,{passive:true});
  }
})();
</script>
<script>
(function(){
  var PREFIXES=[{flag:'TH',code:'+66',name:'ไทย'},{flag:'US',code:'+1',name:'USA'},{flag:'GB',code:'+44',name:'UK'},{flag:'JP',code:'+81',name:'Japan'},{flag:'KR',code:'+82',name:'Korea'},{flag:'SG',code:'+65',name:'Singapore'},{flag:'MY',code:'+60',name:'Malaysia'},{flag:'AU',code:'+61',name:'Australia'}];
  var menu=document.getElementById('prefix-menu');if(!menu)return;
  PREFIXES.forEach(function(p){
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .12s;font-family:"Noto Sans Thai",sans-serif;font-size:13px;color:rgba(180,210,255,.80);border-bottom:1px solid rgba(74,158,255,.06);';
    row.innerHTML='<span style="font-family:var(--f-mono);font-size:11px;color:rgba(200,168,75,.65);min-width:36px">'+p.code+'</span><span style="font-size:12px;color:rgba(140,185,255,.50)">'+p.name+'</span>';
    row.addEventListener('mouseover',function(){this.style.background='rgba(74,158,255,0.06)';});
    row.addEventListener('mouseout',function(){this.style.background='';});
    row.addEventListener('click',function(){selectPrefix(p);});
    menu.appendChild(row);
  });
  function selectPrefix(p){ var val=document.getElementById('prefix-val');if(val)val.textContent=p.code;togglePrefixMenu(false);setTimeout(function(){var ph=document.getElementById('payment-phone');if(ph)ph.focus();},50); }
  window.togglePrefixMenu=function(force){ var open=force!==undefined?force:menu.style.display==='none';menu.style.display=open?'block':'none'; };
  document.addEventListener('click',function(e){if(!e.target.closest('#prefix-btn')&&!e.target.closest('#prefix-menu'))menu.style.display='none';});
})();
</script>
<script>
function showUpgradeModal(){ var m=document.getElementById('upgrade-modal');if(m)m.style.display='flex'; }
function hideUpgradeModal(){ var m=document.getElementById('upgrade-modal');if(m)m.style.display='none'; }
document.getElementById('upgrade-modal')?.addEventListener('click',function(e){if(e.target===this)hideUpgradeModal();});
function startCheckout(){ hideUpgradeModal();stripeSubscribe(); }
async function stripeSubscribe(){ try{ var r=await fetch('/create-subscription',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',credentials:'same-origin'});var d=await r.json();if(d.url)location.href=d.url;else showErr(d.error||'ไม่สามารถเชื่อมต่อ Stripe ได้',5000); }catch(e){showErr('เครือข่าย: '+e,5000);} }
var _msgToday=parseInt(localStorage.getItem('kd_msg_today')||'0');
var _msgDate=localStorage.getItem('kd_msg_date')||'';
var _FREE_LIMIT=20;
function checkAndCountMsg(){ var today=new Date().toDateString();if(_msgDate!==today){_msgToday=0;_msgDate=today;}if(!window.__kdPremium&&_msgToday>=_FREE_LIMIT){showUpgradeModal();return false;}_msgToday++;localStorage.setItem('kd_msg_today',_msgToday);localStorage.setItem('kd_msg_date',_msgDate);updateLimitUI();return true; }
function updateLimitUI(){ var btn=document.getElementById('upgrade-btn');var today=new Date().toDateString();if(_msgDate!==today){_msgToday=0;}if(!window.__kdPremium){var remaining=Math.max(0,_FREE_LIMIT-_msgToday);if(btn)btn.style.display=(remaining<=5)?'inline-flex':'none';}else{if(btn)btn.style.display='none';} }
var _origRun=window.run;window.run=async function(){if(!checkAndCountMsg())return;return _origRun&&_origRun();};
function initSidebarSearch(){ var sb=document.getElementById('session-list');if(!sb)return;var searchHtml='<div style="padding:4px 2px 8px;"><input id="chat-search" type="text" placeholder="ค้นหาแชท..." style="width:100%;padding:7px 10px;border-radius:6px;border:1px solid rgba(74,158,255,0.12);background:rgba(3,4,13,0.60);color:var(--tx);font-size:11px;font-family:var(--f-mono);outline:none;transition:border-color .18s;" oninput="filterChats(this.value)" onfocus="this.style.borderColor=\'rgba(200,168,75,0.35)\'" onblur="this.style.borderColor=\'rgba(74,158,255,0.12)\'"></div>';sb.insertAdjacentHTML('beforebegin',searchHtml); }
function filterChats(q){ var items=document.querySelectorAll('#session-list .session-item,#session-list-rail .session-item');items.forEach(function(el){var title=el.querySelector('.session-title')?.textContent||'';el.style.display=title.toLowerCase().includes(q.toLowerCase())?'':'none';}); }
async function checkPremium(){ try{var r=await fetch('/me',{credentials:'same-origin'});var d=await r.json();window.__kdPremium=d.premium||false;updateLimitUI();}catch(_){window.__kdPremium=false;} }
setTimeout(function(){initSidebarSearch();checkPremium();updateLimitUI();},500);
</script>
