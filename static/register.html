<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070c">
<title>KING DIADEM · REGISTER</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/logo.png" type="image/png">
<meta property="og:title" content="KING DIADEM · REGISTER">
<meta property="og:type" content="website">
<meta property="og:site_name" content="KING DIADEM">
<meta property="og:image" content="https://king-diadem.onrender.com/static/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://king-diadem.onrender.com/static/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Mono:wght@400;500&family=Noto+Sans+Thai+Looped:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600&display=swap">
<link rel="preload" as="image" href="/static/hero_m.jpg" media="(max-width: 899px)">
<link rel="preload" as="image" href="/static/hero.jpg" media="(min-width: 900px)">
<link rel="stylesheet" href="/static/portal.css">
</head>
<body>

<div id="bg"></div>
<div id="void-overlay"></div>
<canvas id="sky" data-density="5200" aria-hidden="true"></canvas>

<main id="app">
  <div class="card">
    <div class="card-border"></div>
    <div class="card-inner">

      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <!-- logo -->
      <div class="logo-wrap">
        <img src="/static/logo.png" class="logo-img" alt="King Diadem">
        <h1 class="logo-name">KING DIADEM</h1>
        <div class="logo-sub">DriftZero · Governance OS</div>
      </div>

      <!-- divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-dot"></div>
        <div class="divider-line"></div>
      </div>

      <div class="section-label">◈ สร้างบัญชีผู้ใช้ใหม่</div>

      <!-- Google -->
      <a href="/login/google" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#EA4335" d="M9 3.5c1.4 0 2.6.5 3.5 1.4l2.6-2.6C13.5 0 11.4 0 9 0 5.5 0 2.5 2 1.1 5l2.8 2.2C4.6 4.7 6.6 3.5 9 3.5z"/>
          <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.9c-.2 1.1-.9 2-1.7 2.6l2.8 2.2c1.7-1.5 2.6-3.8 2.6-6.4z"/>
          <path fill="#34A853" d="M4.3 10.9c-.3-.8-.5-1.7-.5-2.6s.2-1.8.5-2.6L1.5 3.5C.5 5.1 0 7 0 9s.5 3.9 1.5 5.5l2.8-2.2z"/>
          <path fill="#FBBC05" d="M9 18c2.4 0 4.4-.8 5.9-2.2l-2.8-2.2c-.8.6-1.9 1-3.1 1-2.4 0-4.4-1.6-5.1-3.8L1.1 13C2.5 16 5.5 18 9 18z"/>
        </svg>
        ลงทะเบียนด้วย Google
      </a>

      <!-- OR divider -->
      <div class="or-divider">
        <div class="or-line"></div>
        <div class="or-text">OR</div>
        <div class="or-line"></div>
      </div>

      <!-- form -->
      <div class="field">
        <label class="field-label" for="email">◈ อีเมล</label>
        <input id="email" type="email" placeholder="your@email.com" autocomplete="email">
      </div>

      <div class="field">
        <label class="field-label" for="password">◈ รหัสผ่าน</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <div class="field">
        <label class="field-label" for="confirm">◈ ยืนยันรหัสผ่าน</label>
        <input id="confirm" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <button class="submit-btn" id="register-btn">
        <span class="btn-text">INITIALIZE ACCESS</span>
      </button>

      <div id="msg" class="msg"></div>
      <p class="legal-note">การสมัครหรือเข้าสู่ระบบถือว่ายอมรับ <a href="/terms">ข้อกำหนดการใช้งาน</a> และ <a href="/privacy">นโยบายความเป็นส่วนตัว</a></p>

      <a href="/static/login.html" class="login-link">
        มีบัญชีแล้ว? <span>เข้าสู่ระบบ →</span>
      </a>

      <!-- footer -->
      <div class="footer">
        <div class="footer-text">DRIFTZERO © 2026–3026</div>
        <div class="status-dot">ONLINE</div>
      </div>

    </div>
  </div>
</main>

<script>
/* แปลข้อความ (static/i18n.js) — ไม่มีคำแปลก็คืนภาษาไทย */
function _t(s){ return window.KD_I18N && s ? KD_I18N.t(s) : s; }
/* ── Register ── */
async function register() {
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var confirm  = document.getElementById('confirm').value;
  var msg      = document.getElementById('msg');
  var btn      = document.querySelector('.submit-btn');

  // reset
  msg.className = 'msg';
  msg.textContent = '';
  document.querySelectorAll('input').forEach(function(el){ el.classList.remove('error'); });

  // validate
  if(!email || !password || !confirm){
    msg.className = 'msg error';
    msg.textContent = '⚠ กรุณากรอกข้อมูลให้ครบทุกช่อง';
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    msg.className = 'msg error';
    msg.textContent = '⚠ รูปแบบอีเมลไม่ถูกต้อง';
    document.getElementById('email').classList.add('error');
    return;
  }
  if(password.length < 8){
    msg.className = 'msg error';
    msg.textContent = '⚠ รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร';
    document.getElementById('password').classList.add('error');
    return;
  }
  if(password !== confirm){
    msg.className = 'msg error';
    msg.textContent = '⚠ รหัสผ่านไม่ตรงกัน';
    document.getElementById('confirm').classList.add('error');
    return;
  }

  // submit — logic ของพี่ ไม่แตะ
  btn.disabled = true;
  btn.querySelector('.btn-text').textContent = 'INITIALIZING...';

  // เดิม: เน็ตหลุด / 502 ตอน cold start (ไม่ใช่ JSON) → throw แล้วปุ่มค้าง INITIALIZING ตลอด
  var res = null, data = {};
  try{
    res = await fetch(
      '/register',
      {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      }
    );
    try{ data = await res.json(); }catch(_){ data = {}; }
  }catch(_){ res = null; }

  btn.disabled = false;
  btn.querySelector('.btn-text').textContent = 'INITIALIZE ACCESS';

  if(!res){
    msg.className = 'msg error';
    msg.textContent = '⚠ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ลองใหม่อีกครั้ง';
    return;
  }
  if(res.ok){
    msg.className = 'msg success';
    msg.textContent = '✓ สร้างบัญชีสำเร็จ — กำลังเข้าสู่ระบบ...';
    setTimeout(function(){ window.location.href = '/'; }, 1200);
  } else {
    msg.className = 'msg error';
    var m = data.message || data.error || (typeof data.detail === 'string' ? data.detail : '');
    msg.textContent = '⚠ ' + _t(m || (res.status >= 502 ? 'เซิร์ฟเวอร์กำลังตื่น — รอสัก 30 วินาทีแล้วลองใหม่' : 'เกิดข้อผิดพลาด กรุณาลองใหม่'));
  }
}

/* ── Touch: ป้องกัน double-tap zoom ── */
document.querySelector('.google-btn')?.addEventListener('touchend', function(e){
  e.preventDefault(); window.location.href = this.href;
}, { passive: false });

/* ── Enter key support ── */
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter') register();
});
/* ผูกปุ่มด้วย addEventListener — CSP ไม่อนุญาต handler ที่เขียนในแท็ก HTML แล้ว (กันสคริปต์แปลกปลอม) */
document.getElementById('register-btn').addEventListener('click', function(){ register(); });
</script>
<script src="/static/cinema_sky.js" defer></script>
<script src="/static/i18n.js" defer></script>
</body>
</html>
