<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a14">
<title>วงจรระบบ · KING DIADEM</title>
<link rel="canonical" href="https://king-diadem.onrender.com/circuit">
<link rel="icon" href="/static/icons/favicon-48.png" sizes="48x48" type="image/png">
<meta name="description" content="วงจรของ KING DIADEM — ทุกไฟล์ใน repo วางตามหมวดจริง ทุกเส้นคือการ import / โหลด / อ้างถึงที่มีอยู่จริงในโค้ด แสงที่วิ่งคือทิศทางที่ไฟล์หนึ่งเรียกใช้อีกไฟล์">
<style>
/* วงจรระบบ — ข้อมูลทั้งหมดมาจาก /api/system_map (สำรอง /static/system_map.json) ที่สร้างจาก repo จริง
   ไม่มีไฟล์หรือเส้นไหนที่วาดขึ้นเอง: หมวด = คอลัมน์ · ไฟล์ = จุดบนคอลัมน์ · เส้น = import / หน้าเว็บโหลด / อ้างถึง
   แสงวิ่งจากไฟล์ที่เรียก → ไปไฟล์ที่ถูกเรียก · มือถือจำกัดแสงพร้อมกัน · ตั้งค่าลดการเคลื่อนไหวไว้ = แสงหยุด */
:root{
  --void:#0b0a14; --tx-hi:#ece8f4; --tx:#b9b4c8; --tx-lo:#7d7893; --gold:#d9c8ff;
  /* พาสเทลโทนลึก: ลาเวนเดอร์ · กุหลาบหม่น · ฟ้าหมอก · มิ้นต์ · ทรายจาง — คลีน ไม่ฉูดฉาด */
  --c-boot:#c9b6ff; --c-request:#f2c4d6; --c-web:#a9c4f5; --c-site:#b6ddd0; --c-pkg:#8d88a8;
  --c-config:#cfc5b6; --c-docs:#e3d3a8; --c-tests:#9fd3cb;
  --f-body:'Noto Sans Thai Looped',system-ui,sans-serif; --f-mono:ui-monospace,'DM Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--tx);font-family:var(--f-body)}
header{padding:18px 16px 6px;max-width:980px;margin:0 auto}
h1{margin:0;font-size:19px;letter-spacing:.22em;color:var(--tx-hi);font-weight:500}
.sub{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--tx)}
.sub b{color:var(--gold);font-weight:500}
.nav{margin-top:8px;font-size:12.5px}
.nav a{color:var(--gold);text-decoration:none;margin-right:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;max-width:980px;margin:0 auto;position:sticky;top:0;z-index:3;
  background:linear-gradient(var(--void) 70%,rgba(11,10,20,0))}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(217,200,255,.14);border-radius:999px;padding:4px 10px;
  font-size:12px;color:var(--tx);background:rgba(255,255,255,.03);cursor:pointer;font-family:inherit}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chip[aria-pressed="false"]{opacity:.38}
.kinds{font-size:11.5px;color:var(--tx-lo);padding:0 16px 4px;max-width:980px;margin:0 auto}
.kinds span{margin-right:12px;white-space:nowrap}
.kinds i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:4px}
#wrap{position:relative;max-width:980px;margin:0 auto}
#cv{position:sticky;top:0;display:block;width:100%;touch-action:pan-y}
#info{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;margin:0 auto;z-index:5;display:none;
  background:rgba(18,16,30,.95);border:1px solid rgba(217,200,255,.28);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55}
#info.on{display:block}
#info .p{font-family:var(--f-mono);color:var(--tx-hi);word-break:break-all;font-size:12.5px}
#info .m{color:var(--tx-lo);font-size:12px;margin-top:2px}
#info .d{margin-top:6px}
#info button{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--tx);font-size:18px;cursor:pointer}
#status{padding:30px 16px;text-align:center;color:var(--tx-lo);font-size:13px}
footer{padding:20px 16px 90px;text-align:center;font-size:12px;color:var(--tx-lo)}
</style>
</head>
<body>
<header>
  <h1>วงจรระบบ</h1>
  <p class="sub" id="sub">กำลังโหลดแผนผังจาก repo จริง…</p>
  <div class="nav"><a href="/">← กลับหน้าหลัก</a><a href="/architecture">สถาปัตยกรรม</a><a href="/equations">สมการ</a></div>
</header>
<div class="legend" id="legend" role="group" aria-label="เลือกหมวดที่จะแสดง"></div>
<div class="kinds">
  <span><i style="background:#c9b6ff"></i>import ของ Python</span>
  <span><i style="background:#a9c4f5"></i>หน้าเว็บโหลด / ส่ง</span>
  <span><i style="background:#7d7893"></i>เทสต์ / เอกสาร / ตั้งค่าอ้างถึง</span>
</div>
<div id="wrap"><canvas id="cv" aria-label="วงจรไฟล์ทั้งหมดของระบบ แตะจุดเพื่อดูว่าไฟล์นั้นต่อกับอะไร"></canvas></div>
<div id="status"></div>
<div id="info" role="dialog" aria-live="polite"><button type="button" id="info-x" aria-label="ปิด">✕</button><div class="p" id="info-p"></div><div class="m" id="info-m"></div><div class="d" id="info-d"></div></div>
<footer>แตะจุดใดก็ได้ แสงจะวิ่งเฉพาะเส้นที่ต่อกับไฟล์นั้น · ข้อมูลสร้างจาก scripts/build_system_map.py</footer>
<script>
(function(){
  'use strict';
  var LANES = [
    ['boot', 'ทำงานตอนบูต'], ['request', 'ทำงานตอนตอบ'], ['web', 'หน้าเว็บ'], ['site', 'เว็บ GitHub Pages'],
    ['pkg', 'ไฟล์บอกโฟลเดอร์'], ['config', 'ตั้งค่า'], ['docs', 'เอกสาร'], ['tests', 'เทสต์']
  ];
  var KIND_COLOR = ['201,182,255', '169,196,245', '160,154,186'];
  var css = getComputedStyle(document.documentElement);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mobile = Math.min(screen.width, screen.height) < 700;
  var MAXP = mobile ? 28 : 70;

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), wrap = document.getElementById('wrap');
  var F = [], E = [], lanes = [], on = {}, W = 0, H = 0, VH = 0, dpr = 1, layer = null, sel = -1, incident = [];
  var BY = {}, pulses = [], last = 0, hub = {x: 0, y: 0, r: 26}, trunks = [];

  function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function laneColor(c){ return (css.getPropertyValue('--c-' + c) || '#888').trim(); }
  function getJSON(u){ return fetch(u, {cache: 'no-cache'}).then(function(r){ if(!r.ok) throw r.status; return r.json(); }); }
  function hash(n){ n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; }

  getJSON('/api/system_map').catch(function(){ return getJSON('/static/system_map.json'); }).then(init).catch(function(){
    document.getElementById('sub').textContent = 'โหลดแผนผังไม่ได้ ลองรีเฟรชอีกครั้ง';
  });

  function init(d){
    if(!d || !d.files) throw 0;
    F = d.files.map(function(f, i){ return {i: i, p: f[0], n: f[1], c: f[2], d: f[3], s: f[4]}; });
    E = (d.edges || []).map(function(e){ return {a: e[0], b: e[1], k: e[2]}; }).filter(function(e){ return F[e.a] && F[e.b]; });
    var counts = {};
    F.forEach(function(f){ counts[f.c] = (counts[f.c] || 0) + 1; });
    lanes = LANES.filter(function(l){ return counts[l[0]]; });
    var known = {}; lanes.forEach(function(l){ known[l[0]] = 1; on[l[0]] = true; });
    F = F.filter(function(f){ return known[f.c]; });
    var keep = {}; F.forEach(function(f){ keep[f.i] = 1; });
    E = E.filter(function(e){ return keep[e.a] && keep[e.b] && e.a !== e.b; });
    BY = {}; F.forEach(function(f){ BY[f.i] = f; });
    E.forEach(function(e){ e.A = BY[e.a]; e.B = BY[e.b]; });
    var nk = [0, 0, 0]; E.forEach(function(e){ nk[e.k]++; });
    document.getElementById('sub').innerHTML = '';
    var sub = document.getElementById('sub');
    sub.appendChild(document.createTextNode('ทุกไฟล์ใน repo วางตามหมวดจริง ทุกเส้นมีอยู่จริงในโค้ด · '));
    var b = el('b', null, F.length.toLocaleString('en-US') + ' ไฟล์ · ' + E.length.toLocaleString('en-US') + ' เส้น');
    sub.appendChild(b);
    sub.appendChild(document.createTextNode(' (import ' + nk[0] + ' · เว็บ ' + nk[1] + ' · อ้างถึง ' + nk[2] + ')' + (d.commit ? ' · commit ' + d.commit : '')));
    var lg = document.getElementById('legend');
    lanes.forEach(function(l){
      var c = el('button', 'chip'); c.type = 'button'; c.setAttribute('aria-pressed', 'true');
      var sw = el('i'); sw.style.background = laneColor(l[0]); c.appendChild(sw);
      c.appendChild(document.createTextNode(l[1] + ' ' + counts[l[0]]));
      c.addEventListener('click', function(){ on[l[0]] = !on[l[0]]; c.setAttribute('aria-pressed', on[l[0]] ? 'true' : 'false'); if(sel >= 0 && !on[BY[sel].c]){ sel = -1; document.getElementById('info').classList.remove('on'); } build(); });
      lg.appendChild(c);
    });
    build();
    window.addEventListener('resize', function(){ clearTimeout(init._t); init._t = setTimeout(build, 150); });
    window.addEventListener('scroll', function(){ if(reduce) draw(0); }, {passive: true});
    cv.addEventListener('click', onTap);
    document.getElementById('info-x').addEventListener('click', close);
    requestAnimationFrame(loop);
  }

  /* ── จัดวาง: หมวด = คอลัมน์ · ไฟล์เรียงตามโฟลเดอร์ · ความสูงทุกคอลัมน์ใกล้กัน ── */
  function build(){
    W = Math.max(320, wrap.clientWidth); VH = Math.max(320, window.innerHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var vis = lanes.filter(function(l){ return on[l[0]]; });
    var n = Math.max(1, vis.length), pad = 18, colW = (W - 2 * pad) / n;
    hub = {x: W / 2, y: 46, r: 24};
    var top = 132, body = Math.max(520, Math.min(1500, VH * 1.6));
    var X = {};
    vis.forEach(function(l, i){ X[l[0]] = pad + (i + .5) * colW; });
    var groups = {};
    F.forEach(function(f){ f.x = f.y = null; if(X[f.c] != null) (groups[f.c] = groups[f.c] || []).push(f); });
    var maxY = top;
    Object.keys(groups).forEach(function(c){
      var g = groups[c].sort(function(a, b){ return a.p < b.p ? -1 : 1; });
      var step = Math.max(4, Math.min(16, body / g.length));
      g.forEach(function(f, k){ f.x = X[c]; f.y = top + 18 + k * step; f.side = k % 2 ? 1 : -1; });
      maxY = Math.max(maxY, top + 18 + g.length * step);
    });
    H = maxY + 40;
    trunks = vis.map(function(l, i){
      var x = X[l[0]], busY = 96 + (Math.abs(x - hub.x) / W) * 10;
      return {c: l[0], pts: [[hub.x, hub.y + hub.r], [hub.x, busY], [x, busY], [x, top + 10]]};
    });
    E.forEach(function(e){ e.pts = (e.A.x == null || e.B.x == null) ? null : route(e, colW); });
    incident = sel >= 0 ? E.filter(function(e){ return e.pts && (e.a === sel || e.b === sel); }) : [];
    wrap.style.height = H + 'px';
    cv.style.height = VH + 'px';
    cv.width = Math.round(W * dpr); cv.height = Math.round(VH * dpr);
    paintLayer();
    pulses = [];
    draw(0);
  }

  /* เส้นแบบลายวงจร: ออกจากจุด → ช่องว่างข้างคอลัมน์ → ขึ้น/ลง → เข้าจุดปลาย (มุมตัด 45°) */
  function route(e, colW){
    var a = e.A, b = e.B, j = hash(e.a * 7919 + e.b) - .5;
    if(a.x === b.x){
      var o = (colW * .18 + Math.abs(j) * colW * .22) * a.side;
      return chamfer([[a.x, a.y], [a.x + o, a.y], [a.x + o, b.y], [b.x, b.y]]);
    }
    var dir = b.x > a.x ? 1 : -1, gx = a.x + dir * colW * (.5 + j * .3);
    var gx2 = b.x - dir * colW * (.5 - j * .3);
    if(Math.abs(b.x - a.x) <= colW * 1.01) return chamfer([[a.x, a.y], [gx, a.y], [gx, b.y], [b.x, b.y]]);
    var mid = (a.y + b.y) / 2 + j * 40;
    return chamfer([[a.x, a.y], [gx, a.y], [gx, mid], [gx2, mid], [gx2, b.y], [b.x, b.y]]);
  }
  function chamfer(p){
    var out = [p[0]], r = 5;
    for(var i = 1; i < p.length - 1; i++){
      var A = p[i - 1], B = p[i], C = p[i + 1];
      var l1 = Math.hypot(B[0] - A[0], B[1] - A[1]), l2 = Math.hypot(C[0] - B[0], C[1] - B[1]);
      if(l1 < 1 || l2 < 1){ continue; }
      var k1 = Math.min(r, l1 / 2) / l1, k2 = Math.min(r, l2 / 2) / l2;
      out.push([B[0] - (B[0] - A[0]) * k1, B[1] - (B[1] - A[1]) * k1]);
      out.push([B[0] + (C[0] - B[0]) * k2, B[1] + (C[1] - B[1]) * k2]);
    }
    out.push(p[p.length - 1]);
    var len = 0; out.L = [0];
    for(var q = 1; q < out.length; q++){ len += Math.hypot(out[q][0] - out[q - 1][0], out[q][1] - out[q - 1][1]); out.L.push(len); }
    out.len = len;
    return out;
  }
  function at(p, d){
    if(d <= 0) return p[0]; if(d >= p.len) return p[p.length - 1];
    var i = 1; while(p.L[i] < d) i++;
    var t = (d - p.L[i - 1]) / ((p.L[i] - p.L[i - 1]) || 1);
    return [p[i - 1][0] + (p[i][0] - p[i - 1][0]) * t, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * t];
  }
  function stroke(g, p){ g.beginPath(); g.moveTo(p[0][0], p[0][1]); for(var i = 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]); g.stroke(); }

  /* ชั้นนิ่ง (วาดครั้งเดียว): ฮับ · ลำต้น · เส้นทั้งหมดจางๆ · จุดไฟล์ */
  function paintLayer(){
    layer = document.createElement('canvas');
    layer.width = Math.round(W * dpr); layer.height = Math.round(H * dpr);
    var g = layer.getContext('2d'); g.scale(dpr, dpr); g.lineCap = 'round'; g.lineJoin = 'round';
    var dim = sel >= 0;
    /* คลีน: ตอนยังไม่แตะ เห็นแค่ import กับหน้าเว็บ (เส้นที่ "ทำงาน" จริง) · เส้นอ้างถึงของเทสต์/เอกสารโผล่เมื่อแตะไฟล์ */
    [1, 0].forEach(function(k){
      g.strokeStyle = 'rgba(' + KIND_COLOR[k] + ',' + (dim ? .03 : .11) + ')';
      g.lineWidth = .6;
      E.forEach(function(e){ if(e.k === k && e.pts) stroke(g, e.pts); });
    });
    var font = getComputedStyle(document.body).fontFamily;
    trunks.forEach(function(t){
      g.strokeStyle = laneColor(t.c); g.globalAlpha = .45; g.lineWidth = 1; stroke(g, t.pts);
      var col = F.filter(function(f){ return f.c === t.c && f.x != null; });
      if(col.length){ g.globalAlpha = .22; g.beginPath(); g.moveTo(t.pts[3][0], t.pts[3][1]); g.lineTo(t.pts[3][0], col[col.length - 1].y); g.stroke(); }
      g.globalAlpha = .9; g.fillStyle = laneColor(t.c); g.beginPath(); g.arc(t.pts[3][0], t.pts[3][1], 2.6, 0, 7); g.fill();
      g.globalAlpha = .75; g.font = '500 9px ' + font; g.textAlign = 'center';
      g.fillText(String(col.length), t.pts[3][0], t.pts[3][1] - 7);
      g.globalAlpha = 1;
    });
    F.forEach(function(f){
      if(f.x == null) return;
      g.fillStyle = laneColor(f.c); g.globalAlpha = dim && f.i !== sel ? .25 : .8;
      g.beginPath(); g.arc(f.x, f.y, Math.max(1, Math.min(2.2, .6 + Math.log10(f.n + 1) * .45)), 0, 7); g.fill();
    });
    g.globalAlpha = 1;
    var gr = g.createRadialGradient(hub.x, hub.y, 2, hub.x, hub.y, hub.r * 1.8);
    gr.addColorStop(0, 'rgba(217,200,255,.22)'); gr.addColorStop(1, 'rgba(217,200,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(hub.x, hub.y, hub.r * 1.8, 0, 7); g.fill();
    g.strokeStyle = 'rgba(217,200,255,.7)'; g.lineWidth = 1; g.beginPath(); g.arc(hub.x, hub.y, hub.r, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(242,196,214,.35)'; g.beginPath(); g.arc(hub.x, hub.y, hub.r + 4, 0, 7); g.stroke();
    g.fillStyle = '#ece8f4'; g.font = '500 8.5px ' + font; g.textAlign = 'center';
    g.fillText('KING', hub.x, hub.y - 2); g.fillText('DIADEM', hub.x, hub.y + 9);
  }

  /* ── แสงวิ่ง ── */
  function spawn(){
    var pool = incident.length ? incident : null, e;
    if(pool) e = pool[(Math.random() * pool.length) | 0];
    else if(Math.random() < .12 && trunks.length){ var t = trunks[(Math.random() * trunks.length) | 0]; if(!t.path) t.path = chamfer(t.pts); e = {pts: t.path, k: 0, trunk: t.c}; }
    else {
      for(var tries = 0; tries < 8; tries++){
        e = E[(Math.random() * E.length) | 0];
        if(e && e.pts && e.k !== 2) break;
      }
    }
    if(!e || !e.pts) return;
    pulses.push({e: e, d: 0, v: 90 + Math.random() * 130});
  }
  function loop(t){
    requestAnimationFrame(loop);
    if(document.hidden || !layer) return;
    var dt = last ? Math.min(.05, (t - last) / 1000) : 0; last = t;
    if(!reduce){
      var cap = incident.length ? Math.min(MAXP, Math.max(6, incident.length * 2)) : MAXP;
      while(pulses.length < cap) spawn();
      pulses.forEach(function(p){ p.d += p.v * dt; });
      pulses = pulses.filter(function(p){ return p.d < p.e.pts.len + 30; });
    }
    draw(dt);
  }
  function offset(){ var r = wrap.getBoundingClientRect(); return Math.max(0, Math.min(H - VH, -r.top)); }
  function draw(){
    if(!layer) return;
    var oy = offset();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(layer, 0, Math.round(oy * dpr), cv.width, cv.height, 0, 0, cv.width, cv.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, -oy * dpr);
    ctx.lineCap = 'round';
    if(incident.length){
      incident.forEach(function(e){
        ctx.strokeStyle = 'rgba(' + KIND_COLOR[e.k] + ',' + (e.a === sel ? .6 : .35) + ')'; ctx.lineWidth = .9; stroke(ctx, e.pts);
      });
      var f = BY[sel];
      ctx.strokeStyle = '#ece8f4'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, 7); ctx.stroke();
    }
        pulses.forEach(function(p){
      var pts = p.e.pts;
      if(pts[0][1] > oy + VH + 40 && pts[pts.length - 1][1] > oy + VH + 40) return;
      var col = p.e.trunk ? '242,196,214' : KIND_COLOR[p.e.k];
      for(var s = 0; s < 6; s++){
        var q = at(pts, p.d - s * 5); if(q[1] < oy - 20 || q[1] > oy + VH + 20) continue;
        ctx.fillStyle = 'rgba(' + col + ',' + (0.85 - s * .14) + ')';
        ctx.beginPath(); ctx.arc(q[0], q[1], s ? 1 : 1.8, 0, 7); ctx.fill();
      }
      var h = at(pts, p.d);
      ctx.fillStyle = 'rgba(' + col + ',.12)'; ctx.beginPath(); ctx.arc(h[0], h[1], 4.5, 0, 7); ctx.fill();
    });
  }

  /* ── แตะจุด: ดูว่าไฟล์นี้ต่อกับอะไร ── */
  function onTap(ev){
    var r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top + offset();
    if(Math.hypot(x - hub.x, y - hub.y) < hub.r){ close(); return; }
    var best = -1, bd = 14;
    F.forEach(function(f){ if(f.x == null) return; var d = Math.hypot(f.x - x, (f.y - y) * 1.4); if(d < bd){ bd = d; best = f.i; } });
    if(best < 0){ close(); return; }
    select(best);
  }
  function select(i){
    sel = i; var f = BY[i];
    incident = E.filter(function(e){ return e.pts && (e.a === i || e.b === i); });
    var outN = incident.filter(function(e){ return e.a === i; }).length, inN = incident.length - outN;
    var lane = LANES.filter(function(l){ return l[0] === f.c; })[0];
    document.getElementById('info-p').textContent = f.p;
    document.getElementById('info-m').textContent = (lane ? lane[1] : f.c) + ' · ' + (f.n || 0).toLocaleString('en-US') + ' บรรทัด · เรียกใช้ ' + outN + ' · ถูกเรียก ' + inN;
    document.getElementById('info-d').textContent = f.d || '';
    document.getElementById('info').classList.add('on');
    pulses = []; paintLayer(); draw(0);
  }
  function close(){ sel = -1; incident = []; document.getElementById('info').classList.remove('on'); pulses = []; paintLayer(); draw(0); }
})();
</script>
