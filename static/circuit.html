<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0709">
<title>วงจรระบบ · KING DIADEM</title>
<link rel="canonical" href="https://king-diadem.onrender.com/circuit">
<link rel="icon" href="/static/icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap">
<meta name="description" content="วงจรของ KING DIADEM — ทุกไฟล์ใน repo เรียงเป็นวงแหวนรอบแกนกลาง ทุกเส้นคือการเรียกใช้ที่มีอยู่จริงในโค้ด กดดูเส้นทางที่ข้อความหนึ่งเดินผ่านระบบ">
<style>
/* วงจรระบบ (มณฑล) — ข้อมูลจาก /api/system_map (สำรอง /static/system_map.json) ที่สร้างจาก repo จริงเท่านั้น
   วงใน → นอก: ทำงานตอนตอบ · ทำงานตอนบูต · หน้าเว็บ · (GitHub Pages · package · ตั้งค่า · เอกสาร) · เทสต์
   เส้น = import / หน้าเว็บโหลด / อ้างถึง · แสงวิ่งจากไฟล์ที่เรียก → ไฟล์ที่ถูกเรียก
   "ดูข้อความเดินทาง" = ลำดับจริงใน app.py (_run_kernel): risk_engine → kernel_voice → story_check → kernel_voice (ตอบจากสมการ ยังไม่มี AI) → middle_path */
:root{
  --void:#0a0709; --tx-hi:#efe6d8; --tx:#bdb1a6; --tx-lo:#857a76; --gold:#e2cf9a; --rose:#d99aa5;
  --c-boot:#e2cf9a; --c-request:#d99aa5; --c-web:#b7a3d9; --c-site:#a9cbb8; --c-pkg:#7f7891;
  --c-config:#d6cdbd; --c-docs:#bfa9c9; --c-tests:#8fbfb6;
  --f-body:'Noto Sans Thai Looped',system-ui,sans-serif; --f-mono:ui-monospace,'DM Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--tx);font-family:var(--f-body);overflow-x:hidden}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:720px;padding:16px 16px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:15px;letter-spacing:.32em;color:var(--tx-hi);font-weight:500}
header a{color:var(--tx-lo);font-size:12px;text-decoration:none}
.stat{width:100%;max-width:720px;padding:4px 16px 0;font-size:12px;color:var(--tx-lo);font-family:var(--f-mono)}
.stat b{color:var(--gold);font-weight:500}
#stage{position:relative;width:100%;max-width:720px}
#cv{display:block;margin:0 auto;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;padding:0 16px;max-width:720px;font-size:11px;color:var(--tx-lo)}
.legend button{background:none;border:0;color:inherit;font:inherit;padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
.legend button[aria-pressed="false"]{opacity:.35}
.go{margin:14px auto 6px;display:block;background:none;border:1px solid rgba(226,207,154,.45);color:var(--gold);
  border-radius:999px;padding:9px 20px;font:inherit;font-size:13px;letter-spacing:.06em;cursor:pointer}
.go:disabled{opacity:.4}
#cap{min-height:40px;text-align:center;font-size:13px;color:var(--tx-hi);padding:0 16px}
#cap small{display:block;color:var(--tx-lo);font-family:var(--f-mono);font-size:11px;margin-top:2px}
#flood{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 42%,#fffaf0 0%,#fbecc8 28%,#efd29a 55%,#d9a6a0 85%,#b9848c 100%)}
#cap{position:relative;z-index:5;transition:color 1.2s}
body.film #cap{display:none}
#cap.lit{color:#2a1712;font-size:15px;letter-spacing:.04em}
#cap.lit small{color:#6b4a3a}
#info{position:fixed;left:12px;right:12px;bottom:12px;max-width:520px;margin:0 auto;display:none;z-index:5;
  background:rgba(20,12,15,.95);border:1px solid rgba(226,207,154,.28);border-radius:12px;padding:10px 36px 10px 14px;font-size:12.5px}
#info.on{display:block}
#info .p{font-family:var(--f-mono);color:var(--tx-hi);word-break:break-all}
#info .m{color:var(--tx-lo);margin-top:2px}
#info button{position:absolute;top:4px;right:6px;background:none;border:0;color:var(--tx);font-size:17px;cursor:pointer;padding:4px 8px}
</style>
</head>
<body>
<header><h1>วงจร</h1><a href="/">← กลับ</a></header>
<div class="stat" id="stat">กำลังโหลด…</div>
<div id="stage"><canvas id="cv" aria-label="ไฟล์ทั้งหมดของระบบเรียงเป็นวงแหวน แตะจุดเพื่อดูว่าไฟล์นั้นต่อกับอะไร"></canvas></div>
<div class="legend" id="legend" role="group" aria-label="หมวด"></div>
<button type="button" class="go" id="go" disabled>▶ ดูข้อความเดินทาง</button>
<div id="cap" aria-live="polite"></div>
<div id="info" role="dialog" aria-live="polite"><button type="button" id="info-x" aria-label="ปิด">✕</button><div class="p" id="info-p"></div><div class="m" id="info-m"></div></div>
<script>
(function(){
  'use strict';
  var NAME = {request: 'ตอนตอบ', boot: 'ตอนบูต', web: 'เว็บ', site: 'Pages', pkg: 'package', config: 'ตั้งค่า', docs: 'เอกสาร', tests: 'เทสต์'};
  /* วงแหวน: [หมวด, รัศมี (สัดส่วน)] — หมวดเล็กแบ่งวงเดียวกันเป็นส่วนโค้ง */
  var RINGS = [[['request'], .24], [['boot'], .36], [['web'], .52], [['site', 'pkg', 'config', 'docs'], .68], [['tests'], .86]];
  /* เส้นทางจริงของข้อความหนึ่ง (app.py _run_kernel) */
  var JOURNEY = [
    ['app.py', 'รับข้อความ'],
    ['ENGINE/risk_engine.py', 'วัดความเสี่ยง'],
    ['core/kernel_voice.py', 'จับเหตุฉุกเฉิน'],
    ['core/story_check.py', 'ตรวจเรื่องเล่า'],
    ['core/kernel_voice.py', 'ตอบจากสมการ · เติมสายด่วน'],   /* ยังไม่มี AI ต่ออยู่: app.py ข้าม llm_gemini ให้ kernel_voice ตอบ */
    ['core/middle_path.py', 'ทางสายกลาง'],
    ['app.py', 'ตอบกลับ']
  ];
  var KC = ['226,207,154', '183,163,217', '150,138,150'];
  var css = getComputedStyle(document.documentElement);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mobile = Math.min(screen.width, screen.height) < 700;
  var MAXP = mobile ? 26 : 60;

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var F = [], E = [], BY = {}, PATH = {}, on = {}, counts = {};
  var S = 0, C = 0, R = 0, dpr = 1, layer = null, rot = 0, last = 0;
  var sel = -1, inc = [], pulses = [], flashes = [], trip = null, waves = [], beat = 0, stars = [];
  /* โหมดภาพยนตร์ (?film=1) — ข้อมูลชุดเดียวกัน เล่าเป็นเรื่องต่อเนื่อง:
     มืด → แสงจุดที่ใจกลาง → ข้อความเดินทาง → แสงแผ่ออกทีละวงจนถึงวงนอกสุด → ทั้งระบบทำงาน
     ?film=1&wait=1 = รอ window.__filmGo ก่อนเริ่ม (ใช้ตอนอัดคลิป ให้รอชุดข้อมูลสดก่อน) */
  var film = /[?&]film=1/.test(location.search) ? {t: 0, ph: 0, ign: 0, rev: 0, go: false} : null;
  if(film) document.body.classList.add('film');
  /* ลายเส้นพู่กัน (?ink=1): หัวหนาปลายแหลม แกนขาวทองคม ขอบสีบาง หมอกเรืองน้อยลง */
  var INK = !!film && /[?&]ink=1/.test(location.search);
  /* กล้อง (เฉพาะโหมดภาพยนตร์): จุดโฟกัส · ซูม · เอียงเป็นมิติ (ty < 1 = วงเอียงหนีสายตา) */
  var cam = {x: 0, y: 0, z: 1, ty: 1}, dust = [], chimes = [], storm = [], acc = null, accx = null;
  /* สีแสงของภาพยนตร์: ชมพู · ลาเวนเดอร์ · ฟ้ามิ้นต์ (ไล่สีเดียวกับหัวข้อหน้า The Universe) */
  var FILMC = ['240,184,216', '196,176,255', '166,236,223'];
  function fc(){ return FILMC[(Math.random() * 3) | 0]; }
  /* แสงที่ไหล = พาสเทลไล่ตามตำแหน่งบนจอ (ชมพู → ลาเวนเดอร์ → มิ้นต์) · โครงสร้าง = ทองคม ตัดกัน */
  var SIDE = [[240, 184, 216], [196, 176, 255], [166, 236, 223]], GOLD = '255,212,128';
  function sideC(sx){
    var k = Math.max(0, Math.min(1, sx / S)) * 2, i = k < 1 ? 0 : 1, f = k - i, a = SIDE[i], b = SIDE[i + 1];
    return Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f);
  }
  function camSet(){ ctx.translate(C, C); ctx.scale(cam.z, cam.z * cam.ty); ctx.rotate(rot); ctx.translate(-cam.x, -cam.y); }
  function proj(x, y){                               /* ตำแหน่งในวง → ตำแหน่งบนจอ (ใช้วางป้ายที่ไม่หมุน/ไม่เอียงตาม) */
    var dx = x - cam.x, dy = y - cam.y, c = Math.cos(rot), s = Math.sin(rot);
    return [C + (dx * c - dy * s) * cam.z, C + (dx * s + dy * c) * cam.z * cam.ty];
  }
  function ease(k){ k = Math.max(0, Math.min(1, k)); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
  function lerp(a, b, k){ return a + (b - a) * k; }
  function capText(a, b){
    if(film){                                        /* ภาพยนตร์: คำบรรยายวาดบนภาพ ค่อยๆ จางเปลี่ยน ไม่เด้ง */
      var cur = film.capCur;
      if(cur && cur.a === (a || '') && cur.b === (b || '')) return;
      if(cur && cur.a === (a || '') && cur.t != null){ cur.b = b || ''; return; }   /* แค่ตัวเลขเปลี่ยน ไม่ต้องจางใหม่ */
      film.capPrev = cur; film.capCur = {a: a || '', b: b || '', t: film.t}; return;
    }
    capTextDom(a, b);
  }
  function capTextDom(a, b){ var c = document.getElementById('cap'); c.textContent = a || ''; if(b) c.appendChild(el('small', null, b)); }
  function filmStep(dt){
    if(!film.go){
      film.go = !!window.__filmGo || !/[?&]wait=1/.test(location.search); if(!film.go) return;
      if(window.__seed) window.__seed(7);              /* อัดเป็นช่วงๆ แล้วต่อกันได้ตรงเฟรม: สุ่มชุดเดิมทุกรอบ */
      pulses = []; flashes = []; waves = []; dust = []; storm = [];
    }
    film.t += dt; film.dt = dt;
    if(film.ph === 0){                              /* เปิด: ชื่อปรากฏในความมืด → ใจกลางค่อยๆ สว่าง */
      film.title = 0;                                 /* ฉากเปิดแบบค่ายหนัง วาดใน filmIntro() */
      film.ign = ease((film.t - 3.9) / 1.4);           /* ใจกลางติดไฟตอนกล้องพุ่งเข้าไปถึง */
      if(film.t > 4.9 && !film.said0){ film.said0 = 1; capText('ข้อความหนึ่งมาถึง', ''); }
      if(film.t >= 5.8){ film.ph = 1; startTrip(); }
    } else if(film.ph === 1 && !trip){
      film.ph = 3; film.t0 = film.t; waves.push({r: R * .1, a: 1});
      capText('แล้วแสงก็แผ่ไปทั้งระบบ', fmt(F.length) + ' ไฟล์ · ' + fmt(E.length) + ' เส้น · ทุกเส้นคือโค้ดจริง');
    } else if(film.ph === 3){
      var k = ease((film.t - film.t0) / 7);
      film.rev = R * (.08 + 1.0 * k);
      film.camK = ease((film.t - film.t0) / 6);     /* กล้องถอยออกจนเห็นทั้งจักรวาล */
      RINGS.forEach(function(r){ if(!r.chimed && film.rev >= r[1] * R){ r.chimed = 1; chimes.push({r: r[1] * R, c: r[0][0], a: 1, age: 0}); } });
      film.lit = film.lit || {}; film.nlit = film.nlit || 0;
      F.forEach(function(f){ if(!film.lit[f.i] && vis(f) && f.rf * R <= film.rev){ film.lit[f.i] = 1; film.nlit++;
        /* วาบไล่กันเป็นระลอก ไม่พร้อมกันทั้งวง (เดิม 737 ไฟล์วาบพร้อมกันจนเป็นวงขาวทึบ) */
        if(f.i % 3 === 0) flashes.push({f: f, a: .75, wait: (f.i % 11) * .09}); } });
      capText('แล้วแสงก็แผ่ไปทั้งระบบ', 'แสงถึงแล้ว ' + fmt(film.nlit) + ' / ' + fmt(F.length) + ' ไฟล์ · ' + fmt(E.length) + ' เส้น · ทุกเส้นคือโค้ดจริง');
      if(film.t - film.t0 > 8){ film.ph = 4; film.t1 = film.t; }
    }
    /* กล้อง: ช่วงมืดและเดินทาง = ใกล้ ตามหัวแสง · ช่วงแผ่ = ถอยออก + เอียงเป็นมิติ */
    var tx = C, ty0 = C, tz = 2.3, tilt = 1;
    if(film.ph === 1 && trip){
      var h = tripHead(), holding = trip.hold > 0 && trip.i > 0;   /* ระหว่างแตกแสง: ถอยกล้องให้เห็นแสงไหลไปทั้งวง */
      tx = lerp(C, h[0], holding ? .15 : .55); ty0 = lerp(C, h[1], holding ? .15 : .55); tz = holding ? 1.2 : 1.9;
    }
    if(film.ph >= 3){ var kk = film.camK || 0; tz = lerp(1.9, .97, kk); tilt = lerp(1, .74, kk); }
    if(film.ph === 4){                               /* ช่วงใยแสงเต็ม: กล้องค่อยๆ เข้าใกล้ใจกลาง วงหายใจ ไม่นิ่ง */
      var pk = ease((film.t - film.t1 - 14) / 22);
      tz = lerp(.97, 1.16, pk); tilt = .74 + .07 * Math.sin((film.t - film.t1) * .22) * pk;
    }
    var sm = film.ph >= 3 ? .06 : .035;
    cam.x = lerp(cam.x || C, tx, sm); cam.y = lerp(cam.y || C, ty0, sm); cam.z = lerp(cam.z, tz, sm); cam.ty = lerp(cam.ty, tilt, .05);
    chimes.forEach(function(c){ c.age = (c.age || 0) + dt; c.a -= dt * .45; }); chimes = chimes.filter(function(c){ return c.a > 0; });
    if(film.ph === 4){                                /* จบ: แสงนับพันสายวิ่งพร้อมกันบนเส้นโค้ดจริงทุกเส้น ทิ้งรอยซ้อนจนทั้งจอสว่าง */
      film.lit = film.lit || {}; film.nlit = film.nlit || 0;
      F.forEach(function(f){ if(!film.lit[f.i] && vis(f)){ film.lit[f.i] = 1; film.nlit++; } });
      var tt = film.t - film.t1;
      /* ข้อความหลั่งไหล: 1 → หลายร้อยข้อความพร้อมกัน แล้วใยแสงทั้งระบบค่อยๆ ตามมา */
      var mk = ease(tt / 18), wantM = Math.round(1 + 180 * mk * mk);
      film.msgSent = film.msgSent || 0;
      for(var mm = 0; msgs.length < wantM && mm < 6; mm++){ spawnMsg(); film.msgSent++; }
      stepMsgs(dt);
      if(tt < 16) capText('ข้อความหลั่งไหลเข้ามา', 'ข้อความที่ ' + fmt(film.msgSent) + ' · ทุกข้อความผ่านเส้นทางจริงเดียวกัน 7 ขั้น');
      else capText('', '');
      var sk = ease((tt - 8) / 18); film.stormK = sk;
      var want = Math.round(40 + 2400 * sk);
      for(var n = 0; storm.length < want && n < 260; n++){
        var e = E[(Math.random() * E.length) | 0];
        if(e && vis(e.A) && vis(e.B)) storm.push({e: e, d: 0, v: R * (.3 + Math.random() * .6), c: fc()});
      }
      storm.forEach(function(p){ p.d += p.v * dt; });
      storm = storm.filter(function(p){ return p.d < p.e.pts.len; });
      film.trav = (film.trav || 0);
    }
    if(film.ghost){ film.ghost.a -= dt * .3; if(film.ghost.a <= 0) film.ghost = null; }
    stepFloats(dt);
  }
  /* สไปรต์แสงเรือง (วาดครั้งเดียว ใช้ drawImage แทน shadowBlur ที่หนักบนมือถือ) */
  var GLOW = {};
  function glow(c){
    if(GLOW[c]) return GLOW[c];
    var g = document.createElement('canvas'); g.width = g.height = 64; var x = g.getContext('2d');
    var gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(' + c + ',.9)'); gr.addColorStop(.18, 'rgba(' + c + ',.45)'); gr.addColorStop(1, 'rgba(' + c + ',0)');
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return (GLOW[c] = g);
  }
  function blob(c, x, y, r, a){ ctx.globalAlpha = a; ctx.drawImage(glow(c), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1; }

  function el(t, c, x){ var e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; }
  function col(c){ return (css.getPropertyValue('--c-' + c) || '#888').trim(); }
  function getJSON(u){ return fetch(u, {cache: 'no-cache'}).then(function(r){ if(!r.ok) throw r.status; return r.json(); }); }
  function fmt(n){ return n.toLocaleString('en-US'); }

  /* ขึ้นภาพทันทีจากชุดที่บันทึกไว้ (static) แล้วเปลี่ยนเป็นชุดสดเมื่อเซิร์ฟเวอร์นับเสร็จ (~10 วินาทีครั้งแรก) */
  var ready = false, pending = null;   /* ชุดสดที่มาถึงระหว่างดูข้อความเดินทาง — รอจบก่อนค่อยสลับ */
  getJSON('/static/system_map.json').then(function(d){ if(!ready) init(d); }).catch(function(){});
  getJSON('/api/system_map').then(function(d){ if(d && d.files){ if(trip) pending = d; else init(d); } })
    .catch(function(){ if(!ready) document.getElementById('stat').textContent = 'โหลดไม่ได้ ลองรีเฟรช'; });

  function init(d){
    var first = !ready; ready = true;
    var ringOf = {}; F = []; E = []; BY = {}; PATH = {}; counts = {};
    if(trip){ trip = null; cap(-1); document.getElementById('go').disabled = false; }
    sel = -1; inc = []; document.getElementById('info').classList.remove('on');
    RINGS.forEach(function(r){ r[0].forEach(function(c){ ringOf[c] = r; if(on[c] == null) on[c] = true; }); });
    F = d.files.map(function(f, i){ return {i: i, p: f[0], n: f[1], c: f[2]}; }).filter(function(f){ return ringOf[f.c]; });
    F.forEach(function(f){ BY[f.i] = f; PATH[f.p] = f; counts[f.c] = (counts[f.c] || 0) + 1; });
    E = (d.edges || []).map(function(e){ return {a: e[0], b: e[1], k: e[2], A: BY[e[0]], B: BY[e[1]]}; })
      .filter(function(e){ return e.A && e.B && e.a !== e.b; });
    var live = (counts.boot || 0) + (counts.request || 0), st = document.getElementById('stat');
    st.textContent = '';
    [['', fmt(F.length)], [' ไฟล์ · ', fmt(E.length)], [' เส้น · รันจริง ', String(live)]].forEach(function(x){
      st.appendChild(document.createTextNode(x[0])); st.appendChild(el('b', null, x[1]));
    });

  /* ── จัดวาง: มุม (ไม่ขึ้นกับขนาดจอ) ── */
  function place(){
    RINGS.forEach(function(r){
      var cats = r[0].filter(function(c){ return counts[c]; }), tot = 0;
      cats.forEach(function(c){ tot += counts[c]; });
      var gap = cats.length > 1 ? .06 : 0, span = Math.PI * 2 - gap * cats.length, a0 = -Math.PI / 2;
      cats.forEach(function(c){
        var g = F.filter(function(f){ return f.c === c; }).sort(function(x, y){ return x.p < y.p ? -1 : 1; });
        var arc = span * g.length / tot;
        g.forEach(function(f, k){ f.ang = a0 + (k + .5) * arc / g.length; f.rf = r[1]; });
        a0 += arc + gap;

    });
  }
  function size(){
    var w = Math.min(document.getElementById('stage').clientWidth, 720), h = window.innerHeight * .74;
    S = Math.max(300, Math.min(w, Math.max(h, 320)));
    C = S / 2; R = C - 8; dpr = film ? Math.max(1, window.devicePixelRatio || 1) : Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = cv.style.height = S + 'px'; cv.width = cv.height = Math.round(S * dpr);
    F.forEach(function(f){ f.x = C + Math.cos(f.ang) * f.rf * R; f.y = C + Math.sin(f.ang) * f.rf * R; });
    E.forEach(function(e){ e.pts = curve(e.A, e.B); });
    paint();
  }
  /* เส้นโค้งผ่านใกล้แกนกลาง — ยิ่งสองไฟล์ห่างกัน ยิ่งโค้งเข้าใกล้ศูนย์กลาง */
  function curve(A, B){
    var mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, k = .42;
    var cx = C + (mx - C) * k, cy = C + (my - C) * k, p = [], L = [0], len = 0;
    for(var i = 0; i <= 18; i++){

  /* ── ชั้นนิ่ง (วาดใหม่เมื่อเปลี่ยนตัวกรอง/เลือก) ── */
  function paint(){
    layer = document.createElement('canvas'); layer.width = layer.height = Math.round(S * dpr);
    var g = layer.getContext('2d'); g.scale(dpr, dpr);

    g.lineWidth = .5;
    [1, 0].forEach(function(k){
      g.strokeStyle = 'rgba(' + KC[k] + ',' + (dim ? .025 : .07) + ')';
      E.forEach(function(e){ if(e.k === k && vis(e.A) && vis(e.B)) line(g, e.pts); });
    });

    bg.addColorStop(0, 'rgba(70,24,38,.35)'); bg.addColorStop(.6, 'rgba(30,14,24,.18)'); bg.addColorStop(1, 'rgba(10,7,9,0)');

    stars.forEach(function(st){ g.fillStyle = 'rgba(239,230,216,' + (.08 + st[2] * .25) + ')'; g.fillRect(st[0] * S, st[1] * S, st[2] > .85 ? 1.2 : .7, st[2] > .85 ? 1.2 : .7); });

  /* ── แสงวิ่ง ── */

      if(e && vis(e.A) && vis(e.B) && (inc.length || e.k !== 2 || (film && film.ph >= 3 && Math.random() < .5)) && (!film || film.ph < 3 || (e.A.rf * R <= film.rev && e.B.rf * R <= film.rev))) break; e = null;

  function draw(){

      ctx.globalCompositeOperation = 'lighter'; blob('190,70,95', C, C, R * .32 * film.ign, .9 * film.ign); blob('226,207,154', C, C, R * .14 * film.ign, .5 * film.ign);

  var intro = null;

      ctx.fillStyle = 'rgba(10,7,9,.7)'; var w = ctx.measureText(T.names[k - 1][1]).width;
      ctx.fillRect(right ? x + 7 : x - 11 - w, y - 8, w + 4, 16);
      ctx.fillStyle = k === T.i ? '#efe6d8' : 'rgba(226,207,154,.75)'; ctx.fillText(T.names[k - 1][1], right ? x + 9 : x - 9, y);
    });
    ctx.globalAlpha = 1;
  }
  function cap(i, fan){
    if(film){ if(i >= 0 && trip && trip.names[i]){ var jj = trip.names[i];
      capText((i + 1) + '/' + trip.names.length + ' · ' + jj[1], jj[0] + (fan ? ' → เรียกต่อ ' + fan + ' ไฟล์' : '') + ' · รวม ' + trip.touched + ' ไฟล์'); } return; }
    var c = document.getElementById('cap'); c.textContent = '';
    if(i < 0 || !trip) return;
    var j = trip.names[i]; if(!j) return;
    c.appendChild(document.createTextNode((i + 1) + '/' + trip.names.length + ' · ' + j[1]));
    c.appendChild(el('small', null, j[0] + (fan ? ' → เรียกต่อ ' + fan + ' ไฟล์' : '') + ' · รวม ' + trip.touched + ' ไฟล์'));
  }

  /* ── แตะไฟล์ ── */
  function tap(ev){
    if(trip) return;
    var r = cv.getBoundingClientRect(), x = ev.clientX - r.left - C, y = ev.clientY - r.top - C;
    var c = Math.cos(-rot), s = Math.sin(-rot), px = x * c - y * s + C, py = x * s + y * c + C;
    var best = -1, bd = 12;
    F.forEach(function(f){ if(!vis(f)) return; var d = Math.hypot(f.x - px, f.y - py); if(d < bd){ bd = d; best = f.i; } });
    if(best < 0){ close(); return; }
    sel = best; var f = BY[best];
    inc = E.filter(function(e){ return (e.a === best || e.b === best) && vis(e.A) && vis(e.B); });
    var out = inc.filter(function(e){ return e.a === best; }).length;
    document.getElementById('info-p').textContent = f.p;
    document.getElementById('info-m').textContent = NAME[f.c] + ' · เรียก ' + out + ' · ถูกเรียก ' + (inc.length - out);
    document.getElementById('info').classList.add('on');
    paint();
  }
  function close(){ sel = -1; inc = []; document.getElementById('info').classList.remove('on'); paint(); }
})();
</script>
