<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03040d">
<title>แพทย์ตรวจข้อความ — KING DIADEM</title>
<link rel="icon" href="/static/icons/favicon-48.png" sizes="48x48" type="image/png">
<style>
:root{--void:#06070c;--gold:#d8b878;--line:rgba(216,184,120,.22);--txt:#e6e8ee;--dim:#9aa1b2;--red:#ef8a8a;--ok:#8fd3a8;--amber:#e8c37a}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--txt);font:16px/1.6 "Noto Sans Thai Looped",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 80px}
h1{color:var(--gold);font-size:1.35rem;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 14px;font-size:.92rem}
#sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.88rem}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--red)} .pill.wait{color:var(--dim)} .pill.chg{color:var(--amber)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
select,textarea{background:#0c0f1a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
a.btn,button{background:transparent;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none}
button.ok{border-color:rgba(143,211,168,.55)} button.bad{border-color:rgba(239,138,138,.6)}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card.approved{border-color:rgba(143,211,168,.4)} .card.needs_fix{border-color:rgba(239,138,138,.5)} .card.changed{border-color:rgba(232,195,122,.55)}
.meta{color:var(--dim);font-size:.82rem;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.text{white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
.note{color:var(--amber);font-size:.88rem;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
textarea{width:100%;min-height:64px;margin:6px 0}
#err{color:var(--red)}
#more{margin-top:8px}
</style>
</head>
<body>
<main>
<h1>แพทย์ตรวจข้อความทางการแพทย์</h1>
<p class="sub">ข้อความที่ระบบตอบผู้ใช้เรื่องสุขภาพทุกข้อ ดึงจากโค้ดจริง · กด "ถูกต้อง" หรือ "ต้องแก้" (พร้อมบอกว่าควรแก้อย่างไร)
ถ้าข้อความถูกแก้ภายหลัง สถานะจะกลับเป็น "เปลี่ยนแล้ว รอตรวจใหม่" เอง</p>
<div id="sum"></div>
<div class="filters">
  <select id="f-source" aria-label="หมวด"><option value="">ทุกหมวด</option></select>
  <select id="f-lang" aria-label="ภาษา"><option value="">ทุกภาษา</option></select>
  <select id="f-status" aria-label="สถานะ">
    <option value="todo">ยังต้องตรวจ</option><option value="">ทั้งหมด</option><option value="approved">ถูกต้องแล้ว</option>
    <option value="needs_fix">ต้องแก้</option><option value="changed">เปลี่ยนแล้ว รอตรวจใหม่</option><option value="pending">ยังไม่ได้ตรวจ</option>
  </select>
  <a class="btn" href="/api/admin/medical-export">ส่งออก (.csv)</a>
</div>
<p id="err" hidden></p>
<div id="list"></div>
<button id="more" type="button" hidden>แสดงเพิ่ม</button>
</main>
<script>
(function(){
  var ST = { approved: 'ถูกต้อง', needs_fix: 'ต้องแก้', pending: 'ยังไม่ได้ตรวจ', changed: 'เปลี่ยนแล้ว รอตรวจใหม่' };
  var CLS = { approved: 'ok', needs_fix: 'bad', pending: 'wait', changed: 'chg' };
  var LANG = { th: 'ไทย', en: 'English', es: 'Español', vi: 'Tiếng Việt', zh: '中文', ko: '한국어', ja: '日本語' };
  var all = [], sources = {}, shown = 0, PAGE = 40;
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function err(m){ $('err').textContent = m || ''; $('err').hidden = !m; }

  function summary(){
    var c = { approved: 0, needs_fix: 0, pending: 0, changed: 0 };
    all.forEach(function(x){ c[x.status]++; });
    var box = $('sum'); box.textContent = '';
    box.appendChild(el('span', 'pill', 'ทั้งหมด ' + all.length));
    Object.keys(c).forEach(function(k){ box.appendChild(el('span', 'pill ' + CLS[k], ST[k] + ' ' + c[k])); });
  }

  function filtered(){
    var s = $('f-source').value, l = $('f-lang').value, st = $('f-status').value;
    return all.filter(function(x){
      return (!s || x.source === s) && (!l || x.lang === l) &&
             (!st || (st === 'todo' ? (x.status === 'pending' || x.status === 'changed') : x.status === st));
    });
  }

  function card(x){
    var c = el('div', 'card ' + x.status);
    var m = el('div', 'meta');
    m.appendChild(el('span', 'pill ' + CLS[x.status], ST[x.status]));
    m.appendChild(el('span', null, (sources[x.source] || x.source) + ' · ' + x.topic + ' · ' + (LANG[x.lang] || x.lang)));
    if(x.reviewer) m.appendChild(el('span', null, 'ตรวจโดย ' + x.reviewer + (x.reviewed_at ? ' · ' + new Date(x.reviewed_at * 1000).toLocaleDateString('th-TH') : '')));
    c.appendChild(m);
    c.appendChild(el('p', 'text', x.text));
    if(x.note) c.appendChild(el('p', 'note', 'หมายเหตุ: ' + x.note));
    var row = el('div', 'row');
    var ok = el('button', 'ok', 'ถูกต้อง'); ok.type = 'button';
    var bad = el('button', 'bad', 'ต้องแก้…'); bad.type = 'button';
    row.appendChild(ok); row.appendChild(bad); c.appendChild(row);
    ok.addEventListener('click', function(){ send(x, 'approved', '', c); });
    bad.addEventListener('click', function(){
      if(c.querySelector('textarea')) return;
      var ta = el('textarea'); ta.placeholder = 'ควรแก้อย่างไร (จำเป็น) — เช่น ตัวเลขที่ถูก หรือคำที่ควรใช้แทน';
      ta.value = x.status === 'needs_fix' ? x.note : '';
      var go = el('button', 'bad', 'บันทึกว่าต้องแก้'); go.type = 'button';
      go.addEventListener('click', function(){ send(x, 'needs_fix', ta.value, c); });
      c.appendChild(ta); c.appendChild(go); ta.focus();
    });
    return c;
  }

  function render(reset){
    var list = $('list'), rows = filtered();
    if(reset){ list.textContent = ''; shown = 0; }
    rows.slice(shown, shown + PAGE).forEach(function(x){ list.appendChild(card(x)); });
    shown = Math.min(rows.length, shown + PAGE);
    $('more').hidden = shown >= rows.length;
    if(!rows.length) list.appendChild(el('p', 'sub', 'ไม่มีข้อความในตัวกรองนี้'));
  }

  function send(x, verdict, note, c){
    err('');
    fetch('/api/admin/medical', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify({ id: x.id, verdict: verdict, note: note }) })
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || 'บันทึกไม่สำเร็จ'); return j; }); })
      .then(function(){
        x.status = verdict; x.note = note; x.reviewer = 'คุณ'; x.reviewed_at = Date.now() / 1000;
        c.replaceWith(card(x)); summary();
      })
      .catch(function(e){ err(e.message); });
  }

  function load(){
    fetch('/api/admin/medical', { credentials: 'same-origin' }).then(function(r){
      if(!r.ok) throw new Error(r.status === 404 ? 'หน้านี้สำหรับแพทย์ผู้ตรวจ (REVIEWER_EMAILS) หรือผู้ดูแล — ต้องเคยเข้าด้วย Google' : 'โหลดไม่สำเร็จ');
      return r.json();
    }).then(function(j){
      all = j.items; sources = j.sources || {};
      Object.keys(sources).forEach(function(k){ var o = el('option', null, sources[k]); o.value = k; $('f-source').appendChild(o); });
      Object.keys(LANG).forEach(function(k){ var o = el('option', null, LANG[k]); o.value = k; $('f-lang').appendChild(o); });
      summary(); render(true);
    }).catch(function(e){ err(e.message); });
  }

  ['f-source', 'f-lang', 'f-status'].forEach(function(id){ $(id).addEventListener('change', function(){ render(true); }); });
  $('more').addEventListener('click', function(){ render(false); });
  load();
})();
</script>
</body>
</html>
