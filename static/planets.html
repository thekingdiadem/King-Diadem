/* หัวใจ Tombaugh Regio: สมการรูปหัวใจบนระนาบสัมผัส · ซีกซ้าย (Sputnik Planitia) มีลายเซลล์พาความร้อนของน้ำแข็งไนโตรเจน */

/* ตำแหน่งและขนาดดวง: เดสก์ท็อปอยู่ขวา · มือถืออยู่บน */
' float m=min(uRes.x,uRes.y);vec2 C=uMob>.5?vec2(.5*uRes.x,.36*uRes.y):vec2(.64*uRes.x,.5*uRes.y);',

var prog, U = {}, skyTex = null, earthTex = null, lightsTex = null, skyOn = 0, earthOn = 0;
function sh(type, src){ var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error('shader', gl.getShaderInfoLog(s)); return null; } return s; }
function tex(src, unit, done){
  var im = new Image(); im.decoding = 'async';
  im.onload = function(){ var t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    done(t); };
  im.src = src;
}
if(gl){
  var vs = sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'), fs = sh(gl.FRAGMENT_SHADER, FS);
  if(vs && fs){
    prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);
    ['uRes','uT','uK','uMix','uSkyOn','uEarthOn','uMob','uSky','uEarth','uLights'].forEach(function(n){ U[n] = gl.getUniformLocation(prog, n); });
    var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
    var al = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
    tex('/static/sky/allsky.jpg', 0, function(t){ skyTex = t; skyOn = 1; });
    tex('/static/earth/day.jpg', 1, function(t){ earthTex = t; tex('/static/earth/lights.jpg', 2, function(t2){ lightsTex = t2; earthOn = 1; }); });
  } else gl = null;
}

var cur = 0, shown = 0, fade = 1, t0 = performance.now();
var $ = function(id){ return document.getElementById(id); };
var dots = $('dots');
B.forEach(function(_, i){ var d = document.createElement('button'); d.className = 'dot'; d.type = 'button';
  d.setAttribute('aria-label', B[i].th); d.addEventListener('click', function(){ go(i); }); dots.appendChild(d); });
function fill(i){
  var o = B[i];
  $('kicker').textContent = o.kick; $('name').textContent = o.th; $('en').textContent = o.en; $('tag').textContent = o.tag;
  $('chips').innerHTML = ''; o.chips.forEach(function(c){ var s = document.createElement('span'); s.className = 'chip'; s.textContent = c; $('chips').appendChild(s); });
  $('facts').innerHTML = ''; o.facts.forEach(function(f){ var dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = f[0]; dd.textContent = f[1]; $('facts').appendChild(dt); $('facts').appendChild(dd); });
  $('note').textContent = o.note; $('count').textContent = String(i + 1).padStart(2, '0') + ' / ' + B.length;
  [].forEach.call(dots.children, function(d, j){ d.setAttribute('aria-current', j === i ? 'true' : 'false'); });
  document.title = o.th + ' · ระบบสุริยะ · KING DIADEM';
  try{ history.replaceState(null, '', '#' + o.en.toLowerCase().replace(/^the /, '').replace(/\s+/g, '-')); }catch(_){}
}
function go(i){
  i = (i + B.length) % B.length; if(i === cur) return; cur = i;
  var p = $('panel'); p.classList.add('out');
  setTimeout(function(){ fill(cur); p.classList.remove('out'); }, REDUCED ? 0 : 320);
}
$('prev').addEventListener('click', function(){ go(cur - 1); });
$('next').addEventListener('click', function(){ go(cur + 1); });
addEventListener('keydown', function(e){ if(e.key === 'ArrowRight') go(cur + 1); else if(e.key === 'ArrowLeft') go(cur - 1); });
var sx = null;
cv.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
cv.addEventListener('touchend', function(e){ if(sx === null) return; var dx = e.changedTouches[0].clientX - sx; if(Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); sx = null; }, {passive:true});
(function(){ var hsh = location.hash.slice(1); B.forEach(function(o, i){ if(o.en.toLowerCase().replace(/^the /, '').replace(/\s+/g, '-') === hsh) cur = shown = i; }); })();
fill(cur);

var QS = 1;
function size(){ var q = Math.min(devicePixelRatio || 1, 2) * QS; cv.width = Math.round(innerWidth * q); cv.height = Math.round(innerHeight * q); if(gl) gl.viewport(0, 0, cv.width, cv.height); }
addEventListener('resize', size); size();
/* ลื่นทุกเครื่อง: วัดเวลาเฟรม ถ้าช้ากว่า ~45fps ต่อเนื่อง ลดความละเอียดลงทีละขั้น (ไม่ต่ำกว่า 55%) · เครื่องแรงคมเต็ม DPR 2 */
var lastT = 0, slowN = 0, fastN = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(!gl || document.hidden) return;
  var dt = lastT ? now - lastT : 16; lastT = now;
  if(dt > 22) slowN++; else slowN = Math.max(0, slowN - 1);
  if(dt < 14) fastN++; else fastN = 0;
  if(slowN > 20 && QS > .55){ QS = Math.max(.55, QS * .85); slowN = 0; size(); }
  else if(fastN > 240 && QS < 1){ QS = Math.min(1, QS * 1.1); fastN = 0; size(); }
  var t = REDUCED ? 0 : (now - t0) / 1000;
  /* เปลี่ยนดวง: มืดลงแล้วสว่างขึ้นเป็นดวงใหม่ */
  if(shown !== cur){ fade = Math.max(0, fade - .08); if(fade === 0) shown = cur; } else fade = Math.min(1, fade + .05);
  gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform1f(U.uT, t); gl.uniform1f(U.uK, shown);
  gl.uniform1f(U.uMix, .35 + .65 * fade); gl.uniform1f(U.uSkyOn, skyOn); gl.uniform1f(U.uEarthOn, earthOn);
  gl.uniform1f(U.uMob, innerWidth <= 760 ? 1 : 0);
  if(skyTex){ gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, skyTex); } gl.uniform1i(U.uSky, 0);
  if(earthTex){ gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, earthTex); } gl.uniform1i(U.uEarth, 1);
  if(lightsTex){ gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, lightsTex); } gl.uniform1i(U.uLights, 2);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
})();
