services:
  - type: web
    name: King-Diadem
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --timeout 120 --workers 1 --keep-alive 75 --graceful-timeout 60 --max-requests 200 --max-requests-jitter 20
    healthCheckPath: /health
    disk:
      name: king-diadem-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/king_diadem.db
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY2
        sync: false
      - key: GEMINI_API_KEY3
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PREMIUM_PRICE_ID     # app.py ใช้แยกราคา premium (ถ้าไม่ตั้ง = ใช้ STRIPE_PRICE_ID)
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ส่งประวัติการปรึกษาเข้าอีเมลของเจ้าของบัญชี (core/history_export) — ไม่ตั้ง = ปุ่มส่งอีเมลปิด ดาวน์โหลดได้ตามปกติ
      - key: SMTP_HOST                   # เช่น smtp.gmail.com
        sync: false
      - key: SMTP_PORT                   # 587 (STARTTLS) หรือ 465 (SSL)
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS                   # Gmail: App Password 16 ตัว (ไม่ใช่รหัสผ่านปกติ)
        sync: false
      - key: MAIL_FROM                   # ชื่อผู้ส่ง เช่น "KING DIADEM <you@gmail.com>" (ไม่ตั้ง = SMTP_USER)
        sync: false
