# รันเทสต์อัตโนมัติทุกครั้งที่ push หรือเปิด/อัปเดต PR — ล้มที่นี่ = อย่าเพิ่ง merge
name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # แยกเป็นสามงานที่รันพร้อมกัน และแต่ละงานใช้ทุกแกนของเครื่อง (pytest-xdist -n auto)
  # เดิมรันต่อกันทีละขั้นในงานเดียว ~20–28 นาที · ตอนนี้เวลารวมเท่ากับงานที่ช้าที่สุด (~5–6 นาที)
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [local, hrana-fake]   # local = ไฟล์ในเครื่อง · hrana-fake = ตัวต่อ Turso (DATABASE/turso.py) กับเซิร์ฟเวอร์จำลอง
    name: pytest (${{ matrix.db }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        env:
          KD_DB_DRIVER: ${{ matrix.db == 'hrana-fake' && 'hrana-fake' || '' }}
        run: python -m pytest -q -p no:warnings -n auto

  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ชุดกวาดข้อความ (sweep_all — หลุดแม้ข้อเดียวก็ล้ม · รันคู่ขนานตามจำนวนแกนอยู่แล้ว)
        env:
          KD_AI: "off"
        run: python scripts/sweep_all.py
      - name: สกอร์บอร์ดชุดปิดตา (รายงานอย่างเดียว ไม่ทำให้ล้ม — กันการจูนกับข้อสอบ)
        env:
          KD_AI: "off"
        run: python scripts/blind_score.py
      - name: ตรวจช่องโหว่ของไลบรารี (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
