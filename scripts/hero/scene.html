<html><head><meta charset="utf-8"><style>

<script>

(function(){var a=20261112;function r(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

g.innerHTML=h})();
