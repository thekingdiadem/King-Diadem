<!DOCTYPE html>
<html>
<head>
<title>KING DIADEM Control Room</title>
<style>

body {
  background: #0a0a0a;
  color: #eaeaea;
  font-family: monospace;
  margin: 0;
}

.header {
  padding: 20px;
  font-size: 28px;
  border-bottom: 1px solid #333;
}

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 20px;
}

.panel {
  background: #121212;
  padding: 20px;
  border-radius: 8px;
  border: 1px solid #333;
}

button {
  background: #1e88ff;
  border: none;
  padding: 10px 16px;
  color: white;
  cursor: pointer;
  border-radius: 4px;
  margin-top: 10px;
}

button:hover {
  background: #1565c0;
}

input {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  background: #1b1b1b;
  border: 1px solid #333;
  color: white;
  border-radius: 4px;
  box-sizing: border-box;
}

label {
  font-size: 12px;
  color: #aaa;
  margin-top: 8px;
  display: block;
}

.result {
  margin-top: 10px;
  background: #000;
  padding: 10px;
  border-radius: 4px;
  white-space: pre-wrap;
  font-size: 13px;
  min-height: 60px;
}

</style>
</head>
<body>

<div class="header">👑 KING DIADEM Control Room</div>

<div class="container">

  <div class="panel">
    <h3>Business Analysis</h3>

    <label>Revenue</label>
    <input id="rev" type="number" placeholder="0">

    <label>Cost</label>
    <input id="cost" type="number" placeholder="0">

    <label>Market Growth (%)</label>
    <input id="growth" type="number" placeholder="0">

    <label>Competition (0-10)</label>
    <input id="comp" type="number" placeholder="0">

    <label>Demand (0-10)</label>
    <input id="demand" type="number" placeholder="0">

    <button onclick="runBusiness()">Analyze</button>

    <div id="business_result" class="result">—</div>
  </div>

  <div class="panel">
    <h3>System Status</h3>
    <button onclick="loadSystem()">Load Status</button>
    <div id="system_result" class="result">—</div>

    <h3 style="margin-top:24px">Decision Engine</h3>
    <button onclick="runDecision()">Run Decision</button>
    <div id="decision_result" class="result">—</div>
  </div>

</div>

<script>

async function loadSystem() {
  const r = await fetch("/system")
  const d = await r.json()
  document.getElementById("system_result").innerText = JSON.stringify(d, null, 2)
}

async function runBusiness() {
  const body = {
    revenue:      parseFloat(document.getElementById("rev").value)    || 0,
    cost:         parseFloat(document.getElementById("cost").value)   || 0,
    market_growth:parseFloat(document.getElementById("growth").value) || 0,
    competition:  parseFloat(document.getElementById("comp").value)   || 0,
    demand:       parseFloat(document.getElementById("demand").value) || 0
  }

  const r = await fetch("/analyze-business", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  })

  const d = await r.json()
  document.getElementById("business_result").innerText = JSON.stringify(d, null, 2)
}

async function runDecision() {
  document.getElementById("decision_result").innerText = "Running..."

  try {
    const r = await fetch("/decision", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "api-key": "dev-mode"
      },
      body: JSON.stringify({
        location: "earth",
        food: "medium",
        money: 50,
        risk: "low"
      })
    })

    const d = await r.json()
    document.getElementById("decision_result").innerText = JSON.stringify(d, null, 2)

  } catch(e) {
    document.getElementById("decision_result").innerText = "ERROR: " + e
  }
}

</script>
</body>
</html>
